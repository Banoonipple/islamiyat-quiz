<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lorecraft</title>
<meta name="description" content="Gamified study and exam practice: Mughals to the British Raj">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail (desktop) / bottom dock (phone); content column max 1180px.
   Dark-first "night console": deep ink ground, cyan for action, violet+gold reserved for XP. */
:root {
  --bg: #0B0F17; --bg-glow: rgba(47, 212, 242, 0.06);
  --card: #141A25; --card-2: #1A2230; --card-3: #212B3C;
  --line: rgba(148, 170, 210, 0.11); --line-2: rgba(148, 170, 210, 0.22);
  --fg: #E8EDF6; --fg-2: #A4AFC3; --fg-3: #6D798F;
  --accent: #2FD4F2; --accent-2: #3B82F6; --accent-ink: #03141B; --accent-soft: rgba(47, 212, 242, 0.12);
  --ok: #3DDC97; --ok-soft: rgba(61, 220, 151, 0.12);
  --bad: #FF7A7A; --bad-soft: rgba(255, 122, 122, 0.12);
  --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, 0.13);
  --xp: #A78BFA; --xp-soft: rgba(167, 139, 250, 0.14); --gold: #F5C451;
  --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 10px 30px -12px rgba(0, 0, 0, 0.6);
  --font-display: "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --font-body: "Hind", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F4F9; --bg-glow: rgba(8, 145, 178, 0.06);
    --card: #FFFFFF; --card-2: #EEF2F8; --card-3: #E3E9F2;
    --line: rgba(25, 45, 85, 0.10); --line-2: rgba(25, 45, 85, 0.20);
    --fg: #0F1726; --fg-2: #4A566B; --fg-3: #77839A;
    --accent: #0784A6; --accent-2: #2563EB; --accent-ink: #FFFFFF; --accent-soft: rgba(7, 132, 166, 0.10);
    --ok: #04875A; --ok-soft: rgba(4, 135, 90, 0.10);
    --bad: #D02C2C; --bad-soft: rgba(208, 44, 44, 0.09);
    --warn: #A15C00; --warn-soft: rgba(217, 119, 6, 0.12);
    --xp: #6D3FE0; --xp-soft: rgba(109, 63, 224, 0.10); --gold: #A86A00;
    --shadow: 0 1px 2px rgba(15, 23, 38, 0.05), 0 8px 24px -14px rgba(15, 23, 38, 0.25);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F1F4F9; --bg-glow: rgba(8, 145, 178, 0.06);
  --card: #FFFFFF; --card-2: #EEF2F8; --card-3: #E3E9F2;
  --line: rgba(25, 45, 85, 0.10); --line-2: rgba(25, 45, 85, 0.20);
  --fg: #0F1726; --fg-2: #4A566B; --fg-3: #77839A;
  --accent: #0784A6; --accent-2: #2563EB; --accent-ink: #FFFFFF; --accent-soft: rgba(7, 132, 166, 0.10);
  --ok: #04875A; --ok-soft: rgba(4, 135, 90, 0.10);
  --bad: #D02C2C; --bad-soft: rgba(208, 44, 44, 0.09);
  --warn: #A15C00; --warn-soft: rgba(217, 119, 6, 0.12);
  --xp: #6D3FE0; --xp-soft: rgba(109, 63, 224, 0.10); --gold: #A86A00;
  --shadow: 0 1px 2px rgba(15, 23, 38, 0.05), 0 8px 24px -14px rgba(15, 23, 38, 0.25);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  background-image: radial-gradient(1200px 600px at 85% -10%, var(--bg-glow), transparent 60%);
  background-attachment: fixed;
  font-family: var(--font-body); font-size: 15.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.12; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: clamp(1.9rem, 3.4vw, 2.6rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.18rem; }
p { margin: 0; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 700; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px;
  padding: 22px 16px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--card) 55%, transparent);
  backdrop-filter: blur(10px);
}
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; background: none; border: 0; text-align: left; }
.logo-word { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: 0.04em; }
.logo-word b { color: var(--accent); font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); border: 0; background: none;
  color: var(--fg-2); font-weight: 500; text-align: left; transition: background .15s, color .15s;
}
.nav-btn:hover { background: var(--card-2); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--fg); }
.nav-btn[aria-current="page"] svg { color: var(--accent); }
.rail-sep { height: 1px; background: var(--line); margin: 2px 8px; }
.rail-level { padding: 14px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px; }
.rail-bottom { margin-top: auto; }
.main { min-width: 0; padding-inline: clamp(16px, 3.4vw, 40px); padding-block: 28px 64px; }
.content { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.topbar { display: none; }
.dock { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-block: 12px 104px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); margin-inline: calc(-1 * clamp(16px, 3.4vw, 40px)); padding-inline: clamp(16px, 3.4vw, 40px); border-bottom: 1px solid var(--line); }
  .dock {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  }
  .dock button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border: 0; background: none; color: var(--fg-3); font-size: 0.72rem; font-weight: 500; border-radius: 10px; min-height: 52px; }
  .dock button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
}

/* ---------- primitives ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.tight { padding: 14px 16px; }
.panel { background: var(--card-2); border-radius: var(--r-md); padding: 14px 16px; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 22px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.gauto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.gstats { grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); }
@media (max-width: 900px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .g2 { grid-template-columns: minmax(0, 1fr); } }
.grow { flex: 1 1 auto; min-width: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px;
  border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--card-2); color: var(--fg);
  font-family: var(--font-display); font-weight: 700; font-size: 0.98rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, white 8%), var(--accent)); color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.primary:hover { box-shadow: 0 8px 26px -8px color-mix(in srgb, var(--accent) 85%, transparent); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--card-2); color: var(--fg-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.xp { color: var(--xp); background: var(--xp-soft); border-color: transparent; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.chip.gold { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); border-color: transparent; }
.tag { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.76rem; }

.m-new { --m: var(--fg-3); } .m-needs { --m: var(--bad); } .m-learning { --m: var(--warn); } .m-strong { --m: var(--accent); } .m-mastered { --m: var(--ok); }
.mastery-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--m); background: color-mix(in srgb, var(--m) 14%, transparent); }
.mastery-pill::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--m); transform: rotate(45deg); }

.bar { height: 8px; border-radius: 999px; background: var(--card-3); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--fill, var(--accent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar.xp > i { background: linear-gradient(90deg, var(--xp), var(--gold)); }
.bar.lg { height: 12px; }
.bar.sm { height: 6px; }

.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--card-2); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.search .input { padding-left: 44px; }

/* segmented control & toggles */
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 38px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--fg-2); font-weight: 600; font-size: 0.9rem; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); background: var(--card-2); border: 1px solid transparent; text-align: left; width: 100%; }
.toggle .sw { flex: none; width: 40px; height: 24px; border-radius: 999px; background: var(--card-3); position: relative; transition: background .2s; border: 1px solid var(--line-2); }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-3); transition: transform .2s, background .2s; }
.toggle[aria-checked="true"] .sw { background: var(--accent-soft); border-color: var(--accent); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(16px); background: var(--accent); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--card-2); border: 1px solid transparent; text-align: left; width: 100%; }
.check .box { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line-2); display: grid; place-items: center; }
.check[aria-checked="true"] { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.check[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- dashboard ---------- */
.hero { position: relative; overflow: hidden; padding: 26px; background:
  linear-gradient(135deg, color-mix(in srgb, var(--xp) 14%, var(--card)) 0%, var(--card) 55%), var(--card); }
.hero .lvl { font-size: clamp(2.6rem, 6vw, 3.6rem); line-height: 1; }
.badge-hex { width: 74px; height: 74px; flex: none; display: grid; place-items: center; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: linear-gradient(160deg, var(--xp), color-mix(in srgb, var(--gold) 80%, var(--xp))); color: #160A2E; font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; }
.badge-hex.sm { width: 40px; height: 40px; font-size: 1.05rem; }
.mode-card { display: grid; gap: 14px; padding: 24px; position: relative; overflow: hidden; }
.mode-card .glyph { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; }
.mode-card.study .glyph { background: var(--accent-soft); color: var(--accent); }
.mode-card.test .glyph { background: var(--xp-soft); color: var(--xp); }
.mode-card h2 { font-size: 2rem; letter-spacing: 0.06em; }
.mode-card .btn { justify-self: start; }
.mode-card.test .btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--xp) 90%, white 10%), var(--xp)); color: #fff; box-shadow: 0 6px 20px -8px color-mix(in srgb, var(--xp) 70%, transparent); }
.stat { display: grid; gap: 2px; padding: 16px; }
.stat .num { font-size: 2.1rem; line-height: 1.05; }
.stat .lbl { font-size: 0.86rem; color: var(--fg-2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .d { display: grid; gap: 6px; justify-items: center; font-family: var(--font-display); font-weight: 600; color: var(--fg-3); font-size: 0.85rem; }
.week .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line); }
.week .dot.on { background: color-mix(in srgb, var(--warn) 20%, transparent); border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.week .dot.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 170px; padding-top: 22px; }
.chart .col { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 6px; text-align: center; min-width: 0; }
.chart .v { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; color: var(--fg-2); }
.chart .track { display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line-2); }
.chart .b { width: min(34px, 80%); border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent-2) 70%, var(--accent))); min-height: 3px; transition: height .8s cubic-bezier(.2,.8,.2,1); }
.chart .col.today .b { background: linear-gradient(180deg, var(--gold), var(--xp)); }
.chart .l { font-size: 0.8rem; color: var(--fg-3); font-weight: 600; }

/* ---------- study sets ---------- */
.az { display: flex; flex-wrap: wrap; gap: 4px; }
.az button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); font-family: var(--font-display); font-weight: 700; color: var(--fg); }
.az button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.az button[disabled] { opacity: 0.28; cursor: default; }
.letter-head { display: flex; align-items: center; gap: 14px; scroll-margin-top: 80px; }
.letter-head .L { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; color: var(--accent); width: 34px; }
.letter-head .rule { flex: 1; height: 1px; background: var(--line-2); }
.set-card { display: grid; gap: 14px; align-content: start; transition: border-color .15s, transform .15s; }
.set-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
.set-card h3 { font-size: 1.22rem; }
.counts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.88rem; color: var(--fg-2); }
.counts b { font-family: var(--font-display); font-size: 1.1rem; color: var(--fg); margin-right: 4px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { flex: none; padding: 12px 16px; border: 0; background: none; color: var(--fg-3); font-family: var(--font-display); font-weight: 700; letter-spacing: 0.1em; font-size: 0.92rem; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tool { display: grid; gap: 10px; text-align: left; padding: 20px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
.tool .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--fg-3); font-size: 0.9rem; }
.crumbs button { background: none; border: 0; color: var(--fg-2); padding: 0; }
.crumbs button:hover { color: var(--accent); }

/* notes */
.notes { display: grid; gap: 18px; }
.note-sec { display: grid; gap: 8px; }
.note-sec h3 { font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.note-sec h3::before { content: ""; width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); border-radius: 2px; flex: none; }
.note-sec.key { background: var(--accent-soft); border-radius: var(--r-md); padding: 14px 16px; }
.note-sec ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.note-sec li::marker { color: var(--fg-3); }
.note-sec li ul { margin-top: 4px; }
.notes b, .rich b { color: var(--fg); font-weight: 600; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 22%, transparent) 62%); }
.exam-q { border-left: 3px solid var(--xp); padding: 10px 14px; background: var(--xp-soft); border-radius: 0 var(--r-md) var(--r-md) 0; display: grid; gap: 6px; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.tl .dt { font-family: var(--font-display); font-weight: 700; color: var(--gold); font-size: 1.02rem; }
@media (max-width: 520px) { .tl { grid-template-columns: 84px minmax(0, 1fr); } }
.def { display: grid; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.def .t { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }

/* ---------- flashcards ---------- */
.fc-wrap { perspective: 1400px; }
.fc { position: relative; width: 100%; min-height: 300px; border: 0; padding: 0; background: none; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.7,.2,1); }
.fc.flipped { transform: rotateY(180deg); }

<script>
/* Lorecraft engine: pure logic + a small persisted store. No UI code here. */
(function () {
  "use strict";
  const L = window.LORE;

  // ---------------- utils ----------------
  const U = {};
  U.pad = n => String(n).padStart(2, "0");
  U.dayKey = (d = new Date()) => d.getFullYear() + "-" + U.pad(d.getMonth() + 1) + "-" + U.pad(d.getDate());
  U.addDays = (key, n) => { const [y, m, d] = key.split("-").map(Number); const dt = new Date(y, m - 1, d + n); return U.dayKey(dt); };
  U.shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.fmtTime = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? h + "h " + m + "m" : m + "m " + U.pad(s) + "s"; };
  U.fmtClock = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ":" + U.pad(sec % 60); };
  U.num = n => (n || 0).toLocaleString("en-GB");
  U.sortName = name => name.replace(/^(the|a|an)\s+/i, "");
  U.fmtDate = ts => new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  U.fmtShort = ts => new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" });

  // ---------------- content indexes ----------------
  const C = {};
  C.sets = L.studySets;
  C.setById = Object.fromEntries(L.studySets.map(s => [s.id, s]));
  C.questions = L.questions;
  C.qById = Object.fromEntries(L.questions.map(q => [q.id, q]));
  C.cards = L.flashcards;
  C.cardById = Object.fromEntries(L.flashcards.map(c => [c.id, c]));
  C.defs = L.definitions;
  C.qBySet = {}; C.cardsBySet = {}; C.defsBySet = {};
  L.studySets.forEach(s => { C.qBySet[s.id] = []; C.cardsBySet[s.id] = []; C.defsBySet[s.id] = []; });
  L.questions.forEach(q => C.qBySet[q.set].push(q));
  L.flashcards.forEach(c => C.cardsBySet[c.set].push(c));
  L.definitions.forEach(d => C.defsBySet[d.set].push(d));
  C.setsAlpha = L.studySets.slice().sort((a, b) => U.sortName(a.name).localeCompare(U.sortName(b.name), "en", { sensitivity: "base" }));
  C.setsCourse = L.studySets.slice().sort((a, b) => a.order - b.order);
  C.typeLabels = { mcq: "Multiple Choice", multi: "Multiple Select", fill: "Fill in the Blank", match: "Matching", definition: "Definition" };
  C.diffLabels = { easy: "Easy", medium: "Medium", hard: "Hard" };

  // ---------------- answer checking ----------------
  const A = {};
  A.norm = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[‘’'`".,!?;:()]/g, "").replace(/[-–—_]/g, " ").replace(/\s+/g, " ").trim();
  A.lev = (a, b) => {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
    return prev[n];
  };
  // Typed answers: case/space-insensitive, small typos tolerated for words, numbers must be exact.
  A.fillCorrect = (q, input) => {
    const got = A.norm(input); if (!got) return false;
    return q.accept.some(acc => {
      const want = A.norm(acc);
      if (got === want) return true;
      if (got.replace(/\s/g, "") === want.replace(/\s/g, "")) return true;
      if (/\d/.test(want)) return got.replace(/[\s,]/g, "") === want.replace(/[\s,]/g, "");
      const tol = want.length >= 9 ? 2 : want.length >= 5 ? 1 : 0;
      return tol > 0 && A.lev(got, want) <= tol;
    });
  };
  // response shapes: mcq/definition -> string; multi -> string[]; fill -> string; match -> {left: right}
  A.isAnswered = (q, r) => {
    if (r == null) return false;
    if (q.type === "multi") return r.length > 0;
    if (q.type === "match") return Object.keys(r).length === q.pairs.length;
    if (q.type === "fill") return String(r).trim().length > 0;
    return true;
  };
  A.check = (q, r) => {
    if (r == null) return false;
    switch (q.type) {
      case "mcq": case "definition": return r === q.correctAnswer;
      case "multi": return r.length === q.correctAnswers.length && q.correctAnswers.every(a => r.includes(a));
      case "fill": return A.fillCorrect(q, r);
      case "match": return q.pairs.every(p => r[p.left] === p.right);
      default: return false;
    }
  };
  A.matchScore = (q, r) => q.pairs.filter(p => r && r[p.left] === p.right).length;
  A.correctText = q => {
    switch (q.type) {
      case "multi": return q.correctAnswers.join("; ");
      case "match": return q.pairs.map(p => p.left + " → " + p.right).join("; ");
      default: return q.correctAnswer;
    }
  };
  A.responseText = (q, r) => {
    if (r == null || (Array.isArray(r) && !r.length) || r === "") return "No answer";
    if (q.type === "multi") return r.join("; ");
    if (q.type === "match") return q.pairs.map(p => p.left + " → " + (r[p.left] || "—")).join("; ");
    return String(r);
  };

  // ---------------- levels & grading ----------------
  const X = {};
  X.threshold = n => 25 * (n - 1) * (n + 2); // L1 0, L2 100, L3 250, L4 450, L5 700, L6 1000...
  X.levelOf = xp => { let n = 1; while (X.threshold(n + 1) <= xp) n++; return n; };
  X.progress = xp => { const lvl = X.levelOf(xp), lo = X.threshold(lvl), hi = X.threshold(lvl + 1); return { level: lvl, xp, lo, hi, into: xp - lo, span: hi - lo, pct: (xp - lo) / (hi - lo) * 100 }; };
  X.grade = (pct, g) => pct >= g.A ? "A" : pct >= g.B ? "B" : pct >= g.C ? "C" : pct >= g.D ? "D" : "F";
  // Blitz speed XP: 12 tiers. ≤0.75s = 60 XP, 20s or slower = 5 XP, and 10 tiers in between
  // (55 → 10 XP) whose time limits grow geometrically from 0.75s to 20s.
  X.BLITZ_FAST = 0.75; X.BLITZ_SLOW = 20;
  X.blitzTiers = (() => {
    const t = [{ from: 0, to: X.BLITZ_FAST, xp: 60 }];
    let prev = X.BLITZ_FAST;
    for (let k = 1; k <= 10; k++) { const to = Math.round(X.BLITZ_FAST * Math.pow(X.BLITZ_SLOW / X.BLITZ_FAST, k / 10) * 100) / 100; t.push({ from: prev, to, xp: 60 - 5 * k }); prev = to; }
    t.push({ from: X.BLITZ_SLOW, to: Infinity, xp: 5 });
    return t;
  })();
  X.blitzXp = sec => { if (sec <= X.BLITZ_FAST) return 60; const t = X.blitzTiers.find((x, i) => i > 0 && sec < x.to); return t ? t.xp : 5; };
  X.message = pct => pct >= 90 ? "Excellent! You've mastered this material." : pct >= 75 ? "Great work! A little more practice and you'll master it." : pct >= 60 ? "Good progress. Review your weaker topics." : "Keep practicing. Study Mode can help strengthen your weak areas.";

  // ---------------- default state ----------------
  const DEFAULT_SETTINGS = { sound: true, anim: "full", theme: "dark", qOrder: "random", aOrder: "random", fcMode: "adaptive", dailyGoal: 20, grades: { A: 90, B: 80, C: 70, D: 60 } };
  function freshState() {
    return {
      version: 1,
      profile: { xp: 0, createdAt: Date.now(), onboarded: false },
      stats: { answered: 0, correct: 0, pAnswered: 0, pCorrect: 0, tAnswered: 0, tCorrect: 0, cardsReviewed: 0, knownMarks: 0, studySessions: 0, practiceSessions: 0, flashcardSessions: 0, testsCompleted: 0, studyTimeSec: 0, testTimeSec: 0, bestRun: 0, speedDemon: false, perfectTest: false, blitzRuns: 0, blitzBest: 0, blitzCorrect: 0, blitzAnswered: 0 },
      streak: { current: 0, longest: 0, lastDay: null },
      days: {},
      questions: {},
      cards: {},
      setMeta: {},
      history: [],
      tests: [],
      achievements: {},
      settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS))
    };
  }

  // ---------------- storage adapter (swap for a cloud adapter later) ----------------
  const KEY = "lorecraft:v1";
  const LocalAdapter = {
    ok: true,
    load() { try { const raw = window.localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { this.ok = false; return null; } },
    save(state) { try { window.localStorage.setItem(KEY, JSON.stringify(state)); this.ok = true; } catch (e) { this.ok = false; } },
    clear() { try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ } }
  };
  function migrate(s) {
    const base = freshState();
    if (!s || typeof s !== "object") return base;
    const out = Object.assign(base, s);
    out.profile = Object.assign(freshState().profile, s.profile || {});
    out.stats = Object.assign(freshState().stats, s.stats || {});
    out.streak = Object.assign(freshState().streak, s.streak || {});
    out.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), s.settings || {});
    out.settings.grades = Object.assign({}, DEFAULT_SETTINGS.grades, (s.settings || {}).grades || {});
    ["days", "questions", "cards", "setMeta", "achievements"].forEach(k => { if (!out[k] || typeof out[k] !== "object") out[k] = {}; });
    ["history", "tests"].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
    return out;
  }

  // ---------------- mastery ----------------
  const M = {};
  M.qScore = st => { if (!st || !st.recent || !st.recent.length) return 0; const r = st.recent.slice(-4); return r.reduce((a, b) => a + b, 0) / Math.max(2, r.length); };
  M.cardScore = cs => cs && cs.seen ? Math.min(1, (cs.box || 0) / 3) : 0;
  M.setMastery = (state, setId) => {
    const qs = C.qBySet[setId] || [], cs = C.cardsBySet[setId] || [];
    const qPart = qs.length ? qs.reduce((a, q) => a + M.qScore(state.questions[q.id]), 0) / qs.length : null;
    const cPart = cs.length ? cs.reduce((a, c) => a + M.cardScore(state.cards[c.id]), 0) / cs.length : null;
    let v = qPart == null && cPart == null ? 0 : qPart == null ? cPart : cPart == null ? qPart : qPart * 0.75 + cPart * 0.25;
    return Math.round(v * 100);
  };
  M.setActivity = (state, setId) => {
    const qs = C.qBySet[setId] || []; let attempts = 0, correct = 0, seen = 0;
    qs.forEach(q => { const st = state.questions[q.id]; if (st) { attempts += st.a; correct += st.c; seen++; } });
    const cs = C.cardsBySet[setId] || []; const cardsSeen = cs.filter(c => state.cards[c.id] && state.cards[c.id].seen).length;
    return { attempts, correct, seen, total: qs.length, cardsSeen, cardsTotal: cs.length, started: attempts > 0 || cardsSeen > 0 };
  };
  M.label = (pct, started) => {
    if (started === false) return { key: "new", text: "Not started" };
    if (pct >= 90) return { key: "mastered", text: "Mastered" };
    if (pct >= 70) return { key: "strong", text: "Strong" };
    if (pct >= 40) return { key: "learning", text: "Learning" };
    return { key: "needs", text: "Needs Practice" };
  };
  M.pctLabel = pct => M.label(pct, true);
  M.setCompleted = (state, setId) => { const a = M.setActivity(state, setId); return a.total > 0 && a.seen === a.total && a.cardsSeen === a.cardsTotal; };
  M.recentMisses = (state, setId, days = 14) => {
    const since = Date.now() - days * 864e5;
    return state.history.filter(h => h.set === setId && !h.ok && h.ts >= since).length;
  };
  M.weakQuestions = (state, setId, n = 5) => (C.qBySet[setId] || [])
    .map(q => ({ q, st: state.questions[q.id] })).filter(x => x.st && x.st.a > x.st.c)
    .sort((a, b) => (b.st.a - b.st.c) - (a.st.a - a.st.c) || M.qScore(a.st) - M.qScore(b.st)).slice(0, n);
  M.weakTopics = (state, setId) => {
    const map = {};
    (C.qBySet[setId] || []).forEach(q => { const st = state.questions[q.id]; if (!st) return; const t = map[q.topic] || (map[q.topic] = { topic: q.topic, a: 0, c: 0 }); t.a += st.a; t.c += st.c; });
    return Object.values(map).filter(t => t.a > 0 && t.c / t.a < 0.7).sort((a, b) => a.c / a.a - b.c / b.a);
  };
  M.recommendation = state => {
    let best = null;
    C.sets.forEach(s => {
      const act = M.setActivity(state, s.id); if (!act.attempts) return;
      const m = M.setMastery(state, s.id), miss = M.recentMisses(state, s.id);
      const score = (100 - m) + miss * 6;

    });
    if (best) return best;
    const untouched = C.setsCourse.find(s => !M.setActivity(state, s.id).started);
    return untouched ? { set: untouched, mastery: 0, misses: 0, fresh: true } : null;
  };

  // ---------------- question selection ----------------
  const S = {};
  S.pool = ({ sets, types, difficulty }) => C.questions.filter(q =>
    (!sets || !sets.length || sets.includes(q.set)) &&
    (!types || !types.length || types.includes("mixed") || types.includes(q.type)) &&
    (!difficulty || difficulty === "mixed" || q.difficulty === difficulty));
  S.weight = (state, q, prioritizeWeak) => {
    const st = state.questions[q.id];
    let w;
    if (!st) w = 1.3;
    else {
      const sc = M.qScore(st), wrong = (st.recent || []).slice(-4).filter(x => !x).length;
      w = 0.35 + (1 - sc) * 1.6 + wrong * 0.9; // mastered items never drop to zero
    }
    if (prioritizeWeak) w *= 1.6 - M.setMastery(state, q.set) / 100;
    if (q.type === "definition") w *= 0.55; // generated glossary items shouldn't crowd out authored questions in mixed sessions
    return Math.max(0.15, w);
  };
  S.weightedSample = (items, weights, n) => {
    const pool = items.map((it, i) => ({ it, w: weights[i] })); const out = [];
    while (out.length < n && pool.length) {
      const tot = pool.reduce((a, b) => a + b.w, 0); let r = Math.random() * tot, idx = 0;
      for (; idx < pool.length - 1; idx++) { r -= pool[idx].w; if (r <= 0) break; }
      out.push(pool[idx].it); pool.splice(idx, 1);
    }
    return out;
  };
  S.practice = (state, opts) => {
    let pool = opts.questionIds ? opts.questionIds.map(id => C.qById[id]).filter(Boolean) : S.pool(opts);
    const n = opts.count === "all" ? pool.length : Math.min(Number(opts.count) || 10, pool.length);
    let picked = S.weightedSample(pool, pool.map(q => S.weight(state, q, opts.prioritizeWeak)), n);
    if (!opts.shuffle) picked.sort((a, b) => C.questions.indexOf(a) - C.questions.indexOf(b));
    return picked;
  };
  S.test = (opts, original) => {
    const pool = S.pool(opts);
    const n = opts.count === "all" ? pool.length : Math.min(Number(opts.count) || 10, pool.length);
    let picked = U.shuffle(S.weightedSample(pool, pool.map(q => q.type === "definition" ? 0.55 : 1), n));
    if (original) picked.sort((a, b) => C.questions.indexOf(a) - C.questions.indexOf(b));
    return picked;
  };
  // Presentation copy of a question with options shuffled (or not)
  S.present = (q, shuffleAnswers) => {
    const p = Object.assign({}, q);
    if (q.options && shuffleAnswers && !q.options.every(o => /^\d/.test(o))) p.options = U.shuffle(q.options);
    if (q.type === "match") p.rights = U.shuffle(q.pairs.map(x => x.right));

    if (mode === "random") return U.shuffle(cards);

    return cards.map(c => {
      const cs = state.cards[c.id];
      let p;
      if (!cs || !cs.seen) p = 1.6 + Math.random() * 1.2;               // new cards mixed into the middle

      }
      return { c, p };
    }).sort((a, b) => a.p - b.p).map(x => x.c);

    { id: "test_taker", icon: "clipboard", name: "Test Taker", desc: "Complete your first test.", xp: 25, prog: s => [s.stats.testsCompleted, 1] },

  const listeners = new Set();
  const eventListeners = new Set();
  let state = migrate(LocalAdapter.load());

  function day(s, key = U.dayKey()) { return s.days[key] || (s.days[key] = { activities: 0, pQ: 0, cards: 0, correct: 0, xp: 0, sets: [], maxRun: 0, bestTest: 0 }); }

  const Store = {
    get: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    onEvent(fn) { eventListeners.add(fn); return () => eventListeners.delete(fn); },
    storageOk: () => LocalAdapter.ok,
    // run a mutation against a clone, then derive XP/levels/achievements/goals, persist, notify
    update(mutator) {
      const prev = state; const next = JSON.parse(JSON.stringify(prev)); const events = [];
      const ctx = Ctx(next, events);
      mutator(next, ctx);
      postProcess(prev, next, ctx);
      state = next;
      LocalAdapter.save(state);
      listeners.forEach(fn => fn());
      saveHooks.forEach(fn => fn());
      events.forEach(e => eventListeners.forEach(fn => fn(e)));
      return events;
    },
    reset() { const keepTheme = state.settings; state = freshState(); state.profile.onboarded = true; state.settings = keepTheme; LocalAdapter.save(state); listeners.forEach(fn => fn()); saveHooks.forEach(fn => fn()); },
    // swap in a whole state (e.g. progress loaded from the user's account); does not trigger a cloud save
    replace(next) { state = migrate(next); LocalAdapter.save(state); listeners.forEach(fn => fn()); },
    // called after every persisted change: the cloud sync layer hooks in here
    onSave(fn) { saveHooks.add(fn); return () => saveHooks.delete(fn); },
    fresh: () => freshState(),
    exportJSON: () => JSON.stringify(state)
  };
  const saveHooks = new Set();

  function Ctx(s, events) {
    return {
      xp(amount, label, silent) { if (amount <= 0) return 0; s.profile.xp += amount; day(s).xp += amount; events.push({ type: "xp", amount, label, silent: !!silent }); return amount; },
      toast(title, text, kind) { events.push({ type: "toast", title, text, kind: kind || "info" }); },
      events
    };
  }

  // activity = one question answered or one card reviewed; counts toward the daily goal
  function addActivity(s, ctx, n = 1) { const d = day(s); d.activities += n; }

  // a meaningful session finished: updates the daily streak once per calendar day + daily study bonus
  function markStudyDay(s, ctx) {
    const today = U.dayKey(), d = day(s);
    if (s.streak.lastDay === today) return;
    const yesterday = U.addDays(today, -1);
    s.streak.current = s.streak.lastDay === yesterday ? s.streak.current + 1 : 1;
    s.streak.lastDay = today;
    s.streak.longest = Math.max(s.streak.longest, s.streak.current);
    if (!d.studied) { d.studied = true; ctx.xp(25, "Daily study"); }
  }

  function postProcess(prev, s, ctx) {
    const today = U.dayKey(), d = day(s);
    // daily goal
    if (!d.goalDone && d.activities >= s.settings.dailyGoal) { d.goalDone = true; ctx.xp(25, "Daily goal"); ctx.events.push({ type: "toast", title: "Daily goal complete", text: d.activities + " activities today", kind: "goal" }); }
    // daily challenge
    const ch = challengeFor(today);
    if (!d.challengeDone && ch.val(d) >= ch.goal) { d.challengeDone = true; ctx.xp(40, "Daily challenge"); ctx.events.push({ type: "toast", title: "Daily challenge complete", text: ch.text, kind: "goal" }); }
    // comeback tracking: remember sets that sat below 50% after real effort
    C.sets.forEach(x => { const act = M.setActivity(s, x.id); const m = M.setMastery(s, x.id); const meta = s.setMeta[x.id] || (s.setMeta[x.id] = {}); if (act.attempts >= 5 && m < 50) meta.wasLow = true; });
    // achievements (may award XP, so loop until stable)
    let changed = true, guard = 0;
    while (changed && guard++ < 5) {
      changed = false;
      ACH.forEach(a => {
        if (s.achievements[a.id]) return;
        const [v, goal] = a.prog(s);
        if (v >= goal) { s.achievements[a.id] = Date.now(); changed = true; ctx.events.push({ type: "achievement", a }); s.profile.xp += a.xp; d.xp += a.xp; }
      });
    }
    // level up
    const before = X.levelOf(prev.profile.xp), after = X.levelOf(s.profile.xp);
    if (after > before) ctx.events.push({ type: "levelup", level: after });
  }

  // ---------------- actions ----------------
  const Actions = {};

  Actions.completeOnboarding = () => Store.update(s => { s.profile.onboarded = true; });
  Actions.setSetting = (k, v) => Store.update(s => { s.settings[k] = v; });
  Actions.setGrade = (k, v) => Store.update(s => { s.settings.grades[k] = v; });

  function recordQuestion(s, q, ok, mode) {
    const st = s.questions[q.id] || (s.questions[q.id] = { a: 0, c: 0, recent: [], last: 0 });
    st.a += 1; if (ok) st.c += 1; st.recent.push(ok ? 1 : 0); if (st.recent.length > 6) st.recent.shift(); st.last = Date.now(); st.lastOk = ok;
    s.stats.answered += 1; if (ok) s.stats.correct += 1;
    s.history.unshift({ qid: q.id, set: q.set, ok, ts: Date.now(), mode });
    if (s.history.length > 600) s.history.length = 600;
  }

  // Practice answer: returns {xp, bonus}
  Actions.practiceAnswer = (q, ok, { usedHint, run }) => {
    let result = { xp: 0, already: false };
    Store.update((s, ctx) => {
      recordQuestion(s, q, ok, "practice");
      s.stats.pAnswered += 1; if (ok) s.stats.pCorrect += 1;
      const d = day(s); d.pQ += 1; if (ok) d.correct += 1; if (!d.sets.includes(q.set)) d.sets.push(q.set);
      addActivity(s, ctx);
      if (ok) {
        const st = s.questions[q.id]; const today = U.dayKey();
        if (st.xpDay === today) result.already = true;
        else { st.xpDay = today; let amt = q.difficulty === "hard" ? 15 : 10; if (usedHint) amt = Math.ceil(amt / 2); result.xp = ctx.xp(amt, "Correct"); }
      }
      if (run > s.stats.bestRun) s.stats.bestRun = run;
      if (run > d.maxRun) d.maxRun = run;
      const bonus = { 3: 5, 5: 10, 10: 25, 20: 50 }[run];
      if (ok && bonus) { ctx.xp(bonus, run + " in a row"); result.bonus = bonus; }
    });
    return result;
  };

  Actions.finishPractice = (summary) => Store.update((s, ctx) => {
    s.stats.practiceSessions += 1; s.stats.studySessions += 1; s.stats.studyTimeSec += summary.seconds;
    if (summary.answered >= 5) ctx.xp(25, "Practice session complete");
    if (summary.answered > 0) markStudyDay(s, ctx);
  });

  Actions.rateCard = (card, rating) => {
    let res = { xp: 0 };
    Store.update((s, ctx) => {
      const prevCs = s.cards[card.id] || {};
      const cs = FCS.rate(prevCs, rating); const today = U.dayKey();
      s.stats.cardsReviewed += 1; const d = day(s); d.cards += 1; addActivity(s, ctx);
      let amt = 0;
      if (prevCs.xpDay !== today) { cs.xpDay = today; amt += 2; }
      if (rating === "know") { s.stats.knownMarks += 1; if (prevCs.knownXpDay !== today) { cs.knownXpDay = today; amt += 3; } }
      else cs.knownXpDay = prevCs.knownXpDay;
      if (prevCs.xpDay === today) cs.xpDay = today;
      s.cards[card.id] = cs;
      if (amt) res.xp = ctx.xp(amt, rating === "know" ? "Card known" : "Card reviewed");
    });
    return res;
  };

  // Blitz answer: speed XP from the tier table. Repeating the same question on the same day earns 1/5 (anti-farming).
  Actions.blitzAnswer = (q, ok, seconds) => {
    const res = { xp: 0, tierXp: ok ? X.blitzXp(seconds) : 0, repeat: false };
    Store.update((s, ctx) => {
      recordQuestion(s, q, ok, "blitz");
      s.stats.blitzAnswered += 1; if (ok) s.stats.blitzCorrect += 1;
      const d = day(s); d.blitzQ = (d.blitzQ || 0) + 1; if (ok) d.correct += 1;
      addActivity(s, ctx);
      if (ok) {
        const st = s.questions[q.id]; const today = U.dayKey();
        if (st.blitzDay === today) { res.repeat = true; res.xp = ctx.xp(Math.max(1, Math.round(res.tierXp / 5)), "Blitz (repeat)", true); }
        else { st.blitzDay = today; res.xp = ctx.xp(res.tierXp, "Blitz", true); }
      }
    });
    return res;
  };
  Actions.finishBlitz = (summary) => {
    let newBest = false;
    Store.update((s, ctx) => {
      s.stats.blitzRuns += 1; s.stats.studySessions += 1; s.stats.studyTimeSec += summary.seconds;
      if (summary.score > s.stats.blitzBest) { newBest = s.stats.blitzRuns > 1 || summary.score > 0; s.stats.blitzBest = summary.score; }
      if (summary.answered > 0) markStudyDay(s, ctx);
    });
    return newBest;
  };

  Actions.finishFlashcards = (summary) => Store.update((s, ctx) => {
    s.stats.flashcardSessions += 1; s.stats.studySessions += 1; s.stats.studyTimeSec += summary.seconds;
    if (summary.reviewed >= 5) ctx.xp(25, "Flashcard session complete");
    if (summary.reviewed > 0) markStudyDay(s, ctx);
  });

  // Test submit: records everything, returns the stored record
  Actions.submitTest = (test) => {
    let record;
    Store.update((s, ctx) => {
      const items = test.questions.map((q, i) => {
        const r = test.responses[i]; const ok = A.check(q, r);
        return { qid: q.id, set: q.set, type: q.type, difficulty: q.difficulty, topic: q.topic, question: q.question, prompt: q.prompt || null, yours: A.responseText(q, r), correct: A.correctText(q), explanation: q.explanation, ok, answered: A.isAnswered(q, r), flagged: !!test.flags[i] };
      });
      items.forEach((it, i) => { if (it.answered) recordQuestion(s, test.questions[i], it.ok, "test"); });
      const correct = items.filter(x => x.ok).length, total = items.length, pct = total ? Math.round(correct / total * 100) : 0;
      let run = 0, best = 0; items.forEach(x => { run = x.ok ? run + 1 : 0; best = Math.max(best, run); });
      const bySet = {};
      items.forEach(x => { const b = bySet[x.set] || (bySet[x.set] = { set: x.set, c: 0, t: 0 }); b.t++; if (x.ok) b.c++; });
      s.stats.testsCompleted += 1; s.stats.tAnswered += items.filter(x => x.answered).length; s.stats.tCorrect += correct; s.stats.testTimeSec += test.seconds;
      const d = day(s); d.activities += items.filter(x => x.answered).length;
      if (total >= 5) d.bestTest = Math.max(d.bestTest || 0, pct);
      d.testsRewarded = d.testsRewarded || 0;
      let xp = 0;
      if (total >= 5 && d.testsRewarded < 5) {
        d.testsRewarded++;
        xp += ctx.xp(50, "Test complete");
        if (total >= 10) { const b = pct === 100 ? 200 : pct >= 90 ? 100 : pct >= 80 ? 50 : 0; if (b) xp += ctx.xp(b, pct === 100 ? "Perfect test" : "Score bonus"); }
      }
      if (total >= 5 && pct === 100) s.stats.perfectTest = true;
      if (test.limitSec && pct >= 90 && total >= 5 && test.seconds <= test.limitSec / 2) s.stats.speedDemon = true;
      markStudyDay(s, ctx);
      record = { id: "t" + Date.now(), n: s.tests.length + 1, ts: Date.now(), total, correct, pct, grade: X.grade(pct, s.settings.grades), xp, seconds: test.seconds, limitSec: test.limitSec || 0, bestRun: best, sets: Object.keys(bySet), bySet: Object.values(bySet), items, timedOut: !!test.timedOut };
      s.tests.unshift(record);
      if (s.tests.length > 100) s.tests.length = 100;
    });
    // XP from achievements unlocked by this test is added after; include it in the shown figure
    return record;
  };

  // ---------------- derived views ----------------
  const V = {};
  V.currentStreak = s => { const t = U.dayKey(); return s.streak.lastDay === t || s.streak.lastDay === U.addDays(t, -1) ? s.streak.current : 0; };
  V.today = s => s.days[U.dayKey()] || { activities: 0, pQ: 0, cards: 0, correct: 0, xp: 0, sets: [], maxRun: 0, bestTest: 0 };
  V.week = s => { const t = U.dayKey(); const out = []; for (let i = 6; i >= 0; i--) { const k = U.addDays(t, -i); const d = s.days[k]; const [y, m, dd] = k.split("-").map(Number); out.push({ key: k, label: new Date(y, m - 1, dd).toLocaleDateString("en-GB", { weekday: "short" }), activities: d ? d.activities : 0, studied: !!(d && d.studied), isToday: i === 0 }); } return out; };
  V.calendarWeek = s => { // Monday..Sunday of the current week
    const now = new Date(); const dow = (now.getDay() + 6) % 7; const mon = U.addDays(U.dayKey(), -dow);
    return ["M", "T", "W", "T", "F", "S", "S"].map((l, i) => { const k = U.addDays(mon, i); const d = s.days[k]; return { l, key: k, done: !!(d && d.studied), future: k > U.dayKey(), today: k === U.dayKey() }; });
  };
  V.challenge = s => { const ch = challengeFor(U.dayKey()); const d = V.today(s); return { ...ch, value: Math.min(ch.goal, ch.val(d)), done: !!d.challengeDone }; };
  V.overall = s => {
    const acc = s.stats.answered ? Math.round(s.stats.correct / s.stats.answered * 100) : 0;
    const pAcc = s.stats.pAnswered ? Math.round(s.stats.pCorrect / s.stats.pAnswered * 100) : 0;
    const tAcc = s.stats.tAnswered ? Math.round(s.stats.tCorrect / s.stats.tAnswered * 100) : 0;
    const scores = s.tests.map(t => t.pct);
    const mastered = C.sets.filter(x => M.setMastery(s, x.id) >= 90).length;
    const completed = C.sets.filter(x => M.setCompleted(s, x.id)).length;
    const knownCards = C.cards.filter(c => FCS.status(s.cards[c.id]) === "known").length;
    return { acc, pAcc, tAcc, avgTest: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0, bestTest: scores.length ? Math.max(...scores) : 0, mastered, completed, knownCards };
  };
  V.library = () => ({ sets: C.sets.length, questions: C.questions.length, flashcards: C.cards.length, definitions: C.defs.length });

  window.Lore = { U, C, A, X, M, S, FCS, ACH, CHALLENGES, Store, Actions, V };
})();

</script>

  };
  function Icon({ name, size = 20, stroke = 2, className = "" }) {
    return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${stroke} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className=${className} dangerouslySetInnerHTML=${{ __html: ICONS[name] || "" }}></svg>`;
  }
  function Logo({ size = 30 }) {
    const gid = "lg" + React.useId().replace(/[^a-zA-Z0-9]/g, "");
    return html`<svg width=${size} height=${size} viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id=${gid} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#2FD4F2"/><stop offset="1" stopColor="#A78BFA"/></linearGradient></defs>

  }

  // ======================================================================
  // Sound (synthesised; optional)

  const Sound = {
    ctx: null,
    play(kind) {
      if (!Store.get().settings.sound) return;
      try {
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        const ctx = this.ctx; if (ctx.state === "suspended") ctx.resume();

  function BlitzSession({ s, go, params, setGuard }) {
    const cfg = params.config || { sets: [], duration: 60 };
    const basePool = useMemo(() => blitzPool(cfg.sets), []);
    const deck = useRef([]);
    const draw = () => { if (!deck.current.length) deck.current = U.shuffle(basePool); return S.present(deck.current.pop(), true); };
    const [phase, setPhase] = useState("countdown");
    const [count, setCount] = useState(3);
    const [q, setQ] = useState(null);
    const [fb, setFb] = useState(null);
    const [now, setNow] = useState(performance.now());
    const [run, setRun] = useState(0);
    const [summary, setSummary] = useState(null);
    const endAt = useRef(0), qStart = useRef(0), pausedAt = useRef(0), t0 = useRef(Date.now()), finished = useRef(false);
    const logRef = useRef([]), bestRun = useRef(0), runRef = useRef(0);

    useEffect(() => { setGuard("blitz"); return () => setGuard(false); }, []);
    useEffect(() => {
      if (phase !== "countdown") return;
      if (count === 0) { setQ(draw()); endAt.current = performance.now() + cfg.duration * 1000; qStart.current = performance.now(); setPhase("play"); return; }
      const t = setTimeout(() => setCount(c => c - 1), 650); return () => clearTimeout(t);
    }, [phase, count]);
    useEffect(() => { if (phase !== "play") return; const iv = setInterval(() => setNow(performance.now()), 50); return () => clearInterval(iv); }, [phase]);

    const finish = () => {
      if (finished.current) return; finished.current = true;
      const L = logRef.current, right = L.filter(x => x.ok);
      const score = right.reduce((a, x) => a + x.tierXp, 0), xp = right.reduce((a, x) => a + x.xp, 0);
      const prevBest = Store.get().stats.blitzBest;
      Actions.finishBlitz({ score, answered: L.length, seconds: Math.round((Date.now() - t0.current) / 1000) });
      Sound.play("submit"); setGuard(false);
      setSummary({ score, xp, answered: L.length, correct: right.length, avg: right.length ? right.reduce((a, x) => a + x.secs, 0) / right.length : 0, fastest: right.length ? Math.min(...right.map(x => x.secs)) : 0, best: bestRun.current, newBest: score > prevBest && score > 0, missed: L.filter(x => !x.ok) });
      setPhase("done"); window.scrollTo(0, 0);
    };
    const remaining = phase === "play" ? Math.max(0, (endAt.current - (fb ? pausedAt.current : now)) / 1000) : cfg.duration;
    const elapsedQ = phase === "play" && !fb ? Math.max(0, (now - qStart.current) / 1000) : 0;
    useEffect(() => { if (phase === "play" && !fb && remaining <= 0) finish(); }, [now, phase, fb]);

    const answer = o => {
      if (phase !== "play" || fb || !q) return;
      const secs = (performance.now() - qStart.current) / 1000; const ok = o === q.correctAnswer;
      const r = Actions.blitzAnswer(C.qById[q.id], ok, secs);
      Sound.play(ok ? "correct" : "wrong");
      runRef.current = ok ? runRef.current + 1 : 0; bestRun.current = Math.max(bestRun.current, runRef.current); setRun(runRef.current);
      logRef.current.push({ id: q.id, ok, secs, xp: r.xp, tierXp: r.tierXp, repeat: r.repeat, choice: o, q });
      pausedAt.current = performance.now(); // the clock pauses while feedback shows
      setFb({ choice: o, ok, secs, ...r });
      setTimeout(() => {
        endAt.current += performance.now() - pausedAt.current;
        setFb(null);
        if (endAt.current - performance.now() <= 0) { finish(); return; }
        setQ(draw()); qStart.current = performance.now(); setNow(performance.now());
      }, ok ? 550 : 1400);
    };
    useKeys(e => {
      if (phase !== "play" || !q) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.options.length) answer(q.options[n - 1]);
    });

    if (!basePool.length) return html`<div className="content"><${Empty} icon="zap" title="No questions available" text="These topics have no multiple-choice questions."><button className="btn" onClick=${() => go("blitz")}>Back to Blitz</button><//></div>`;

    if (phase === "countdown") return html`<div className="content page" style=${{ maxWidth: 760 }}><section className="card empty" style=${{ padding: 60 }}><span className="eyebrow">Get ready</span><div className="num blitz-count" key=${count}>${count || "Go!"}</div><p className="muted">Answer with a click, a tap or keys <kbd>1</kbd>–<kbd>4</kbd>.</p></section></div>`;

    if (phase === "done" && summary) {
      const acc = summary.answered ? Math.round(summary.correct / summary.answered * 100) : 0;
      return html`<div className="content page" style=${{ maxWidth: 860 }}>
        <section className="card stack" style=${{ padding: 30 }}>
          <div className="row between"><span className="eyebrow">Blitz complete</span>${summary.newBest && html`<span className="chip gold"><${Icon} name="star" size=${14} />New best score</span>`}</div>
          <div className="row" style=${{ gap: 10, alignItems: "baseline" }}><h1 className="num" style=${{ fontSize: "3.4rem", color: "var(--gold)" }}>${U.num(summary.score)}</h1><span className="tag faint">speed score</span></div>
          <div className="grid g4">
            <${Stat} value=${"+" + summary.xp} label="XP earned" tone="xp" /><${Stat} value=${summary.correct + " / " + summary.answered} label="Correct" tone="ok" />
            <${Stat} value=${acc + "%"} label="Accuracy" tone="accent" /><${Stat} value=${summary.best} label="Best streak" tone="warn" />
          </div>
          <div className="grid g2">
            <div className="panel"><div className="eyebrow">Average correct answer</div><div className="num" style=${{ fontSize: "1.5rem" }}>${summary.correct ? summary.avg.toFixed(2) + "s" : "—"}</div></div>
            <div className="panel"><div className="eyebrow">Fastest correct answer</div><div className="num" style=${{ fontSize: "1.5rem" }}>${summary.correct ? summary.fastest.toFixed(2) + "s" : "—"}</div></div>
          </div>
          <div className="row">
            <button className="btn primary" onClick=${() => go("blitzRun", { config: cfg })}><${Icon} name="rotate" size=${16} />Play again</button>
            <button className="btn" onClick=${() => go("blitz")}>Change settings</button>
            <button className="btn" onClick=${() => go("leaderboard")}><${Icon} name="crown" size=${16} />Leaderboard</button>
            <button className="btn ghost" onClick=${() => go("home")}>Return home</button>
          </div>
        </section>
        ${summary.missed.length > 0 && html`<section className="card stack"><h3>Review your misses</h3>
          ${summary.missed.map((m, i) => html`<div key=${i} className="review-item"><div style=${{ fontWeight: 600 }}>${m.q.question}${m.q.prompt && html`<div className="q-prompt" style=${{ marginTop: 6, fontWeight: 400 }}>${m.q.prompt}</div>`}</div>
            <dl className="kv"><dt>Your answer</dt><dd style=${{ color: "var(--bad)" }}>✕ ${m.choice}</dd><dt>Correct answer</dt><dd>${m.q.correctAnswer}</dd><dt>Explanation</dt><dd className="muted">${m.q.explanation}</dd></dl></div>`)}
        </section>`}
      </div>`;
    }

    const worth = X.blitzXp(elapsedQ);
    const score = logRef.current.reduce((a, x) => a + (x.ok ? x.tierXp : 0), 0);
    const letters = "ABCD";
    return html`<div className="content page" style=${{ maxWidth: 860 }}>
      <div className="row between">
        <span className=${"timer" + (remaining < 10 ? " low" : "")} role="timer" aria-label="Time remaining"><${Icon} name="clock" size=${20} />${remaining.toFixed(1)}s</span>
        <div className="row" style=${{ gap: 8 }}>${run > 1 && html`<span className="chip warn"><${Icon} name="flame" size=${14} />${run} in a row</span>`}<span className="chip gold num" style=${{ fontSize: "1rem" }}>${U.num(score)} pts</span><button className="btn sm ghost" onClick=${finish}>End run</button></div>
      </div>
      <${Bar} pct=${remaining / cfg.duration * 100} fill=${remaining < 10 ? "var(--bad)" : "var(--gold)"} label="Time remaining" />
      <section className="card stack" style=${{ padding: 24 }}>
        <div className="row between"><span className="chip">${setName(q.set)}</span>
          <span className="row" style=${{ gap: 8 }}><span className="faint tnum" style=${{ fontSize: ".85rem" }}>${fb ? fb.secs.toFixed(2) : elapsedQ.toFixed(1)}s</span><span className="chip xp num tnum" style=${{ minWidth: 92, justifyContent: "center" }}>${fb ? (fb.ok ? "+" + fb.xp + " XP" : "+0 XP") : "Worth " + worth}</span></span></div>
        <div className="bar sm" aria-hidden="true"><i style=${{ width: ((fb ? (fb.ok ? fb.tierXp : 0) : worth) / 60 * 100) + "%", background: "linear-gradient(90deg, var(--xp), var(--gold))", transition: "width .15s linear" }}></i></div>
        <div className="q-text">${q.question}</div>
        ${q.prompt && html`<div className="q-prompt">${q.prompt}</div>`}
        <div className="opts">${q.options.map((o, i) => {
          let cls = "opt";
          if (fb) { if (o === q.correctAnswer) cls += " right"; else if (o === fb.choice) cls += " wrong"; else cls += " dim"; }
          return html`<button key=${o} type="button" className=${cls} disabled=${!!fb} onClick=${() => answer(o)}><span className="k">${fb && o === q.correctAnswer ? "✓" : fb && o === fb.choice ? "✕" : letters[i]}</span><span className="t">${o}</span><span className="faint" style=${{ fontSize: ".75rem" }}>${i + 1}</span></button>`;

  // ======================================================================

        ${[[lib.sets, "Study Sets"], [lib.questions, "Questions"], [lib.flashcards, "Flashcards"], [lib.definitions, "Definitions"]].map(([v, l]) => html`<div key=${l}><div className="num" style=${{ fontSize: "2rem", lineHeight: 1 }}>${v}</div><div className="faint" style=${{ fontSize: ".86rem" }}>${l}</div></div>`)}

  // ======================================================================
  // STUDY SETS (alphabetical A–Z)
  // ======================================================================
  const flatNotes = items => items.map(it => typeof it === "string" ? it : it.t + " " + flatNotes(it.sub)).join(" ");
  const SET_INDEX = C.sets.map(set => {
    const topics = [...new Set(C.qBySet[set.id].map(q => q.topic))];
    const defs = C.defsBySet[set.id];
    const notes = A.norm(set.notes.map(n => n.h + " " + flatNotes(n.items)).join(" ").replace(/\*\*/g, ""));
    return { id: set.id, name: set.name.toLowerCase(), chapter: set.chapter.toLowerCase(), desc: set.description.toLowerCase(), keywords: set.keywords, topics, defs, notes };
  });
  function searchSets(q) {
    const t = A.norm(q); if (!t) return C.setsAlpha.map(s => ({ set: s, why: null }));
    const out = [];
    C.setsAlpha.forEach(set => {
      const ix = SET_INDEX.find(x => x.id === set.id); let why = null;
      if (A.norm(ix.name).includes(t)) why = null;
      else if (A.norm(ix.chapter).includes(t)) why = "Chapter: " + set.chapter;
      else { const tp = ix.topics.find(x => A.norm(x).includes(t)); const df = ix.defs.find(d => A.norm(d.term).includes(t)); const dfx = ix.defs.find(d => A.norm(d.definition).includes(t)); const kw = ix.keywords.find(k => A.norm(k).includes(t));
        if (tp) why = "Topic: " + tp; else if (df) why = "Definition: " + df.term; else if (kw) why = "Keyword: " + kw; else if (dfx) why = "Definition: " + dfx.term; else if (A.norm(ix.desc).includes(t)) why = "Description"; else if (ix.notes.includes(t)) why = "Mentioned in notes"; else return; }
      out.push({ set, why });
    });
    return out;
  }
  function StudySets({ s, go }) {
    const [q, setQ] = useState("");
    const results = useMemo(() => searchSets(q), [q]);
    const groups = useMemo(() => { const g = {}; results.forEach(r => { const L = U.sortName(r.set.name).charAt(0).toUpperCase(); (g[L] = g[L] || []).push(r); }); return g; }, [results]);
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const jump = L => {
      const el = document.getElementById("L-" + L); if (!el) return;
      el.scrollIntoView({ behavior: s.settings.anim === "full" ? "smooth" : "auto", block: "start" });
      // if smooth scrolling is unavailable or interrupted, land on the letter anyway
      setTimeout(() => { if (Math.abs(el.getBoundingClientRect().top) > 120) el.scrollIntoView({ block: "start" }); }, 700);
      const btn = el.closest("section") && el.closest("section").querySelector(".btn"); if (btn) btn.focus({ preventScroll: true });
    };
    return html`<div className="content page">
      <${Crumbs} go=${go} items=${[{ label: "Study", go: "study" }, { label: "Study Sets" }]} />
      <header className="row between"><div className="stack" style=${{ gap: 6 }}><span className="eyebrow">A–Z topic browser</span><h1>Study Sets</h1></div><span className="chip">${results.length} of ${C.sets.length} sets</span></header>
      <div className="search"><${Icon} name="search" /><input id="set-search" className="input" type="search" placeholder="Search study sets..." aria-label="Search study sets by topic, definition, keyword or chapter" value=${q} onInput=${e => setQ(e.target.value)} /></div>
      <nav className="az" aria-label="Jump to letter">${letters.map(L => html`<button key=${L} disabled=${!groups[L]} onClick=${() => jump(L)} aria-label=${"Jump to " + L}>${L}</button>`)}</nav>
      ${!results.length && html`<${Empty} icon="search" title="No study sets found" text=${`Nothing matches “${q}”. Try a person, date, place or term from your notes.`}><button className="btn" onClick=${() => setQ("")}>Clear search</button><//>`}
      ${Object.keys(groups).sort().map(L => html`<section key=${L} className="stack">
        <div className="letter-head" id=${"L-" + L}><span className="L">${L}</span><span className="rule"></span></div>
        <div className="grid gauto">${groups[L].map(r => html`<${SetCard} key=${r.set.id} set=${r.set} why=${r.why} s=${s} go=${go} />`)}</div>
      </section>`)}
    </div>`;
  }
  function SetCard({ set, why, s, go }) {
    const m = M.setMastery(s, set.id), act = M.setActivity(s, set.id);
    return html`<article className="card set-card">
      <div className="stack" style=${{ gap: 4 }}><span className="eyebrow">${set.chapter}</span><h3>${set.name}</h3>${why && html`<span className="chip accent" style=${{ justifySelf: "start" }}><${Icon} name="search" size=${12} />${why}</span>`}</div>
      <div className="counts"><span><b>${C.qBySet[set.id].length}</b>Questions</span><span><b>${C.cardsBySet[set.id].length}</b>Flashcards</span><span><b>${C.defsBySet[set.id].length}</b>Definitions</span></div>
      <div className="stack" style=${{ gap: 6 }}><div className="row between"><span className="muted" style=${{ fontSize: ".88rem" }}>Mastery: <b className="num" style=${{ color: "var(--fg)", fontSize: "1rem" }}>${m}%</b></span><${MasteryPill} pct=${m} started=${act.started} /></div><${Bar} pct=${m} label=${set.name + " mastery"} /></div>
      <button className="btn" onClick=${() => go("set", { id: set.id })}>Open set <${Icon} name="arrowR" size=${16} /></button>
    </article>`;
  }

  // ======================================================================
  // STUDY SET PAGE
  // ======================================================================
  function StudySet({ s, go, params }) {
    const set = C.setById[params.id];
    const [tab, setTab] = useState(params.tab || "overview");
    if (!set) return html`<div className="content"><${Empty} title="Study set not found" text="This set may have been renamed."><button className="btn" onClick=${() => go("sets")}>Back to study sets</button><//></div>`;
    const m = M.setMastery(s, set.id), act = M.setActivity(s, set.id);
    const studyPct = act.total + act.cardsTotal ? (act.seen + act.cardsSeen) / (act.total + act.cardsTotal) * 100 : 0;
    const tabs = [["overview", "Overview"], ["flashcards", "Flashcards"], ["practice", "Practice"], ["definitions", "Definitions"], ["notes", "Notes"]];
    return html`<div className="content page">
      <${Crumbs} go=${go} items=${[{ label: "Study", go: "study" }, { label: "Study Sets", go: "sets" }, { label: set.name }]} />
      <header className="card stack" style=${{ gap: 14 }}>
        <div className="row between" style=${{ alignItems: "flex-start" }}>
          <div className="stack grow" style=${{ gap: 6 }}><span className="eyebrow">${set.chapter}</span><h1>${set.name}</h1></div>
          <div className="stack" style=${{ gap: 4, justifyItems: "end" }}><span className="num" style=${{ fontSize: "2.4rem", lineHeight: 1 }}>${m}%</span><${MasteryPill} pct=${m} started=${act.started} /></div>
        </div>
        <div className="stack" style=${{ gap: 6 }}><div className="row between faint" style=${{ fontSize: ".86rem" }}><span>Study progress: ${act.seen}/${act.total} questions tried · ${act.cardsSeen}/${act.cardsTotal} cards reviewed</span><span>Mastery ${m}%</span></div><${Bar} pct=${studyPct} fill="var(--accent-2)" label="Study progress" /><${Bar} pct=${m} cls="sm" label="Mastery" /></div>
      </header>
      <div className="tabs" role="tablist">${tabs.map(([id, l]) => html`<button key=${id} role="tab" aria-selected=${String(tab === id)} onClick=${() => setTab(id)}>${l}</button>`)}</div>
      ${tab === "overview" && html`<${SetOverview} s=${s} set=${set} go=${go} setTab=${setTab} />`}
      ${tab === "flashcards" && html`<${SetFlashcards} s=${s} set=${set} go=${go} />`}
      ${tab === "practice" && html`<${SetPractice} s=${s} set=${set} go=${go} />`}
      ${tab === "definitions" && html`<${DefList} defs=${C.defsBySet[set.id]} go=${go} showSet=${false} />`}
      ${tab === "notes" && html`<div className="card"><${NotesBody} set=${set} /></div>`}
    </div>`;
  }
  function SetOverview({ s, set, go, setTab }) {
    const m = M.setMastery(s, set.id);
    const recent = s.history.filter(h => h.set === set.id).slice(0, 12);
    const rAcc = recent.length ? Math.round(recent.filter(h => h.ok).length / recent.length * 100) : null;
    const weakTopics = M.weakTopics(s, set.id), weakQs = M.weakQuestions(s, set.id, 4);
    return html`<div className="stack-lg">
      <p className="muted" style=${{ maxWidth: "70ch", fontSize: "1.05rem" }}>${set.description}</p>
      <div className="grid g4">
        <${Stat} value=${C.qBySet[set.id].length} label="Questions" /><${Stat} value=${C.cardsBySet[set.id].length} label="Flashcards" />
        <${Stat} value=${C.defsBySet[set.id].length} label="Definitions" /><${Stat} value=${m + "%"} label="Current mastery" tone="accent" />
      </div>
      <div className="grid g2">
        <section className="card stack"><h3>Recent performance</h3>
          ${recent.length ? html`<div className="row" style=${{ gap: 6 }}>${recent.slice().reverse().map((h, i) => html`<span key=${i} className=${"chip " + (h.ok ? "ok" : "bad")} title=${U.fmtShort(h.ts)} aria-label=${h.ok ? "Correct" : "Incorrect"}><${Icon} name=${h.ok ? "check" : "x"} size=${12} stroke=${3} /></span>`)}</div><p className="muted">${rAcc}% correct across your last ${recent.length} answers.</p>` : html`<p className="faint">No answers yet. Start practice to see your recent results here.</p>`}
        </section>
        <section className="card stack"><h3>Weak concepts</h3>
          ${weakTopics.length || weakQs.length ? html`<div className="stack" style=${{ gap: 8 }}>
            ${weakTopics.map(t => html`<div key=${t.topic} className="row between"><span>${t.topic}</span><span className="chip bad tnum">${Math.round(t.c / t.a * 100)}%</span></div>`)}
            ${weakQs.map(x => html`<div key=${x.q.id} className="faint" style=${{ fontSize: ".9rem" }}>Missed ${x.st.a - x.st.c}×: ${x.q.prompt ? x.q.prompt : x.q.question}</div>`)}
          </div>` : html`<p className="faint">Nothing flagged yet. Concepts you miss will show up here.</p>`}
        </section>
      </div>
      <div className="row">
        <button className="btn primary" onClick=${() => setTab("flashcards")} disabled=${!C.cardsBySet[set.id].length}><${Icon} name="layers" size=${18} />Study flashcards</button>
        <button className="btn primary" onClick=${() => go("practice", { config: defaultPractice(s, { sets: [set.id] }) })}><${Icon} name="pencil" size=${18} />Start practice</button>
        <button className="btn" onClick=${() => setTab("notes")}><${Icon} name="notes" size=${18} />Review notes</button>
      </div>
    </div>`;
  }
  function cardCounts(s, cards) { const c = { known: 0, learning: 0, needs: 0, new: 0 }; cards.forEach(x => c[FCS.status(s.cards[x.id])]++); return c; }
  function SetFlashcards({ s, set, go }) {
    const cards = C.cardsBySet[set.id];
    if (!cards.length) return html`<${Empty} icon="layers" title="No flashcards available" text="This Study Set doesn't contain enough suitable material for flashcards."><button className="btn" onClick=${() => go("sets")}>Back to study sets</button><//>`;
    const c = cardCounts(s, cards);
    return html`<section className="card stack">
      <div className="grid g4"><${Stat} value=${c.known} label="Known" tone="ok" /><${Stat} value=${c.learning} label="Learning" tone="warn" /><${Stat} value=${c.needs} label="Needs Practice" tone="bad" /><${Stat} value=${c.new} label="New" /></div>
      <p className="muted">Cards come up in ${s.settings.fcMode === "adaptive" ? "adaptive order: difficult and overdue cards first, with new cards mixed in" : "a fresh random shuffle"}. Change this in Settings.</p>

    </section>`;
  }
  function SetPractice({ s, set, go }) {
    const qs = C.qBySet[set.id]; const byType = {}; qs.forEach(q => byType[q.type] = (byType[q.type] || 0) + 1);
    return html`<section className="card stack">
      <div className="row" style=${{ gap: 8 }}>${Object.keys(byType).map(t => html`<span key=${t} className="chip">${byType[t]} ${C.typeLabels[t]}</span>`)}</div>

        <button className="btn ghost" onClick=${() => go("practiceSetup", { sets: [set.id] })}>Custom setup</button>
      </div>
    </section>`;
  }

  // ======================================================================
  // DEFINITIONS (alphabetical reference)
  // ======================================================================
  function DefList({ defs, go, showSet = true }) {
    if (!defs.length) return html`<${Empty} icon="glossary" title="No definitions here" text="This set doesn't introduce any key terms. Its facts are covered in Notes and Practice." />`;
    const sorted = defs.slice().sort((a, b) => U.sortName(a.term).localeCompare(U.sortName(b.term)));
    const groups = {}; sorted.forEach(d => { const L = U.sortName(d.term).charAt(0).toUpperCase(); (groups[L] = groups[L] || []).push(d); });
    return html`<div className="stack-lg">${Object.keys(groups).map(L => html`<section key=${L}>
      <div className="letter-head"><span className="L">${L}</span><span className="rule"></span></div>
      ${groups[L].map(d => html`<div key=${d.id} className="def"><div className="row between"><span className="t">${d.term}</span>${showSet && html`<button className="chip accent" style=${{ cursor: "pointer" }} onClick=${() => go("set", { id: d.set, tab: "definitions" })}>${setName(d.set)}</button>`}</div><p className="muted">${d.definition}</p></div>`)}
    </section>`)}</div>`;
  }

      ${sel === "timeline" && html`<section className="card"><div className="timeline">${window.LORE.timeline.map((t, i) => html`<div key=${i} className="tl"><span className="dt">${t.date}</span><span><span>${t.text}</span> <button className="chip" style=${{ cursor: "pointer" }} onClick=${() => setSel(t.set)}>${setName(t.set)}</button></span></div>`)}</div></section>`}

  // ======================================================================

  function FlashcardsHub({ s, go }) {
