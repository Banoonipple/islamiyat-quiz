  function FlashcardSession({ s, go, params }) {
    const deck = useMemo(() => {
      const cards = (params.cardIds || []).map(id => C.cardById[id]).filter(Boolean);
      const ordered = FCS.order(Store.get(), cards, params.mode || Store.get().settings.fcMode);
      return params.size === "all" || !params.size ? ordered : ordered.slice(0, params.size);
    }, []);
    const [queue, setQueue] = useState(() => deck.map(c => ({ id: c.id, repeat: false })));
    const [i, setI] = useState(0);
    const [flipped, setFlipped] = useState(false);
    const [ratings, setRatings] = useState({});
    const [reviewed, setReviewed] = useState(0);
    const [done, setDone] = useState(false);
    const t0 = useRef(Date.now());
    const xp = useXpTally();

    if (!deck.length) return html`<div className="content"><${Empty} icon="layers" title="No flashcards available" text="This selection doesn't contain any flashcards."><button className="btn" onClick=${() => go("flashcards")}>Back to flashcards</button><//></div>`;
    const item = queue[i]; const card = item && C.cardById[item.id];
    const counts = { know: 0, unsure: 0, dontknow: 0 }; Object.values(ratings).forEach(r => counts[r]++);

    const flip = () => { setFlipped(f => !f); Sound.play("flip"); };
    const rate = r => {
      if (!flipped || done) return;
      const before = FCS.status(Store.get().cards[card.id]);
      Actions.rateCard(card, r);
      if (r === "know" && before !== "known" && FCS.status(Store.get().cards[card.id]) === "known") Sound.play("mastered");
      setRatings(v => ({ ...v, [card.id]: r })); setReviewed(n => n + 1);
      let q = queue;
      if (r === "dontknow" && !item.repeat) { const pos = Math.min(queue.length, i + 3 + Math.floor(Math.random() * 3)); q = queue.slice(); q.splice(pos, 0, { id: card.id, repeat: true }); setQueue(q); }
      if (i + 1 >= q.length) { Actions.finishFlashcards({ reviewed: reviewed + 1, seconds: Math.round((Date.now() - t0.current) / 1000) }); setDone(true); }
      else { setI(i + 1); setFlipped(false); }
    };
    useKeys(e => {
      if (done) return;
      if (e.code === "Space") { e.preventDefault(); flip(); }
      else if (e.key === "1") rate("dontknow"); else if (e.key === "2") rate("unsure"); else if (e.key === "3") rate("know");
    });
    const back = () => params.backSet ? go("set", { id: params.backSet, tab: "flashcards" }) : go("flashcards");

    if (done) {
      const missed = Object.keys(ratings).filter(id => ratings[id] !== "know");
      return html`<div className="content page" style=${{ maxWidth: 760 }}>
        <section className="card stack" style=${{ textAlign: "center", justifyItems: "center", padding: 32 }}>
          <span className="eyebrow">Flashcard session complete</span>
          <h1>${counts.know === Object.keys(ratings).length ? "Every card known." : "Session complete"}</h1>
          <div className="grid g4" style=${{ width: "100%" }}><${Stat} value=${reviewed} label="Cards Reviewed" /><${Stat} value=${counts.know} label="Known" tone="ok" /><${Stat} value=${counts.unsure} label="Learning" tone="warn" /><${Stat} value=${counts.dontknow} label="Needs Practice" tone="bad" /></div>
          <div className="num" style=${{ fontSize: "1.8rem", color: "var(--xp)" }}>+${xp} XP</div>
          <div className="row" style=${{ justifyContent: "center" }}>
            <button className="btn primary" disabled=${!missed.length} onClick=${() => go("fc", { ...params, cardIds: missed, size: "all" })}><${Icon} name="rotate" size=${16} />Review missed cards</button>
            <button className="btn" onClick=${() => go("fc", { ...params })}><${Icon} name="shuffle" size=${16} />Shuffle again</button>
            <button className="btn" onClick=${() => go("practiceSetup", { sets: [...new Set(deck.map(c => c.set))] })}><${Icon} name="pencil" size=${16} />Start practice</button>
            <button className="btn ghost" onClick=${back}>${params.backSet ? "Back to study set" : "Back to flashcards"}</button>
          </div>
        </section>
      </div>`;
    }

    return html`<div className="content page" style=${{ maxWidth: 820 }}>
      <div className="row between"><button className="btn sm ghost" onClick=${back}><${Icon} name="arrowL" size=${16} />Exit</button><span className="chip">${setName(card.set)}</span></div>
      <div className="stack" style=${{ gap: 8 }}>
        <div className="row between"><span className="tag">Flashcards <span className="num tnum" style=${{ marginLeft: 6 }}>${i + 1} / ${queue.length}</span></span>
          <div className="row" style=${{ gap: 6 }}><span className="chip ok">Known: ${counts.know}</span><span className="chip warn">Learning: ${counts.unsure}</span><span className="chip bad">Needs Practice: ${counts.dontknow}</span></div></div>
        <${Bar} pct=${i / queue.length * 100} label="Flashcard progress" />
      </div>
      <div className="fc-wrap">
        <button key=${i} className=${"fc" + (flipped ? " flipped" : "")} onClick=${flip} aria-label=${flipped ? "Answer shown. Click to show the question" : "Click or press Space to reveal the answer"}>
          <div className="face front" aria-hidden=${flipped}><span className="corner eyebrow">${item.repeat ? "Again · " : ""}Prompt</span><span className="txt">${card.front}</span><span className="hint">Click, tap or press <kbd>Space</kbd> to flip</span></div>
          <div className="face back" aria-hidden=${!flipped}><span className="corner eyebrow" style=${{ color: "var(--accent)" }}>Answer</span><span className="txt">${card.back}</span></div>
        </button>
      </div>
      <div className="rate" aria-label="Rate this card">
        <button className="btn r1" disabled=${!flipped} onClick=${() => rate("dontknow")}>I don't know<small>Press 1</small></button>
        <button className="btn r2" disabled=${!flipped} onClick=${() => rate("unsure")}>I'm not sure<small>Press 2</small></button>
        <button className="btn r3" disabled=${!flipped} onClick=${() => rate("know")}>I know this<small>Press 3</small></button>
      </div>
      ${!flipped && html`<p className="faint" style=${{ textAlign: "center", fontSize: ".88rem" }}>Flip the card to rate it.</p>`}
    </div>`;
  }

  // ======================================================================
  // QUESTION BODY (shared by Practice and Test)
  // ======================================================================
  const PAIR_COLORS = ["#2FD4F2", "#A78BFA", "#F5C451", "#3DDC97", "#FF9F6E", "#F472B6", "#93C5FD", "#BEF264"];
  function QuestionBody({ q, response, onChange, onCommit, reveal, locked, eliminated = [] }) {
    const letters = "ABCDEFGH";
    const head = html`<div className="q-head">
      <div className="q-text">${q.question}</div>
      ${q.prompt && html`<div className="q-prompt">${q.prompt}</div>`}
      ${q.type === "multi" && html`<span className="chip warn" style=${{ justifySelf: "start" }}>Select all that apply.</span>`}
    </div>`;

    if (q.type === "mcq" || q.type === "definition") {
      return html`<div className="stack">${head}<div className="opts" role="radiogroup" aria-label="Answer options">
        ${q.options.map((o, idx) => {
          const chosen = response === o, isRight = o === q.correctAnswer, gone = eliminated.includes(o);
          let cls = "opt"; let mark = null;
          if (reveal) { if (isRight) { cls += " right"; mark = html`<span className="mark"><${Icon} name="check" size=${16} stroke=${3} />${chosen ? "Your answer" : "Correct answer"}</span>`; } else if (chosen) { cls += " wrong"; mark = html`<span className="mark"><${Icon} name="x" size=${16} stroke=${3} />Your answer</span>`; } else cls += " dim"; }
          else if (gone) cls += " dim";
          return html`<button key=${o} type="button" className=${cls} role="radio" aria-checked=${String(chosen)} aria-pressed=${String(!reveal && chosen)} disabled=${locked || gone} onClick=${() => onCommit ? onCommit(o) : onChange(o)}>
            <span className="k">${letters[idx]}</span><span className="t">${o}</span>${mark}${!reveal && gone && html`<span className="mark faint">Ruled out</span>`}</button>`;
        })}
      </div></div>`;
    }
    if (q.type === "multi") {
      const sel = response || [];
      return html`<div className="stack">${head}<div className="opts" role="group" aria-label="Answer options">
        ${q.options.map((o, idx) => {
          const on = sel.includes(o), isRight = q.correctAnswers.includes(o);
          let cls = "opt" + (on ? " sel" : ""); let mark = null;
          if (reveal) { cls = "opt"; if (isRight && on) { cls += " right"; mark = html`<span className="mark"><${Icon} name="check" size=${16} stroke=${3} />Correct</span>`; } else if (isRight) { cls += " right"; mark = html`<span className="mark"><${Icon} name="check" size=${16} stroke=${3} />Missed</span>`; } else if (on) { cls += " wrong"; mark = html`<span className="mark"><${Icon} name="x" size=${16} stroke=${3} />Not correct</span>`; } else cls += " dim"; }
          return html`<button key=${o} type="button" className=${cls} role="checkbox" aria-checked=${String(on)} disabled=${locked} onClick=${() => onChange(prev => { const p = prev || []; return p.includes(o) ? p.filter(x => x !== o) : p.concat(o); })}>
            <span className="box">${on && html`<${Icon} name="check" size=${14} stroke=${3} />`}</span><span className="t">${o}</span>${mark}<span className="faint" style=${{ fontSize: ".75rem" }}>${idx + 1}</span></button>`;
        })}
      </div></div>`;
    }
    if (q.type === "fill") {
      const ok = reveal ? A.fillCorrect(q, response) : null;
      return html`<div className="stack">${head}
        <label className="sr" htmlFor=${"fill-" + q.id}>Your answer</label>
        <input id=${"fill-" + q.id} className="input" style=${reveal ? { borderColor: ok ? "var(--ok)" : "var(--bad)", fontSize: "1.1rem" } : { fontSize: "1.1rem" }} autoComplete="off" spellCheck="false" placeholder="Type your answer…" value=${response || ""} disabled=${locked}
          onInput=${e => onChange(e.target.value)} onKeyDown=${e => { if (e.key === "Enter" && onCommit && String(response || "").trim()) { e.preventDefault(); onCommit(response); } }} autoFocus=${!locked} />
        ${reveal && html`<div className="row" style=${{ gap: 8 }}>${ok ? html`<span className="chip ok"><${Icon} name="check" size=${14} stroke=${3} />Accepted</span>` : html`<span className="chip bad"><${Icon} name="x" size=${14} stroke=${3} />Not accepted</span>`}<span className="muted">Answer: <b>${q.correctAnswer}</b></span></div>`}
      </div>`;
    }
    if (q.type === "match") return html`<div className="stack">${head}<${MatchBody} q=${q} response=${response || {}} onChange=${onChange} reveal=${reveal} locked=${locked} /></div>`;
    return null;
  }
  function MatchBody({ q, response, onChange, reveal, locked }) {
    const [active, setActive] = useState(null);
    const lefts = q.pairs.map(p => p.left), rights = q.rights || q.pairs.map(p => p.right);
    const pairIndex = l => lefts.indexOf(l);
    const leftFor = r => Object.keys(response).find(l => response[l] === r);
    const clickLeft = l => { if (locked) return; if (response[l]) { const n = { ...response }; delete n[l]; onChange(n); setActive(l); return; } setActive(l); };
    const clickRight = r => {
      if (locked) return;
      const owner = leftFor(r);
      if (!active) { if (owner) { const n = { ...response }; delete n[owner]; onChange(n); } return; }
      const n = { ...response }; if (owner) delete n[owner]; n[active] = r; onChange(n);
      const next = lefts.find(l => !n[l]); setActive(next || null);
    };
    const correctRight = l => q.pairs.find(p => p.left === l).right;
    return html`<div className="stack" style=${{ gap: 10 }}>
      ${!reveal && html`<p className="faint" style=${{ fontSize: ".88rem" }}>Choose an item on the left, then its match on the right. Choose a paired item again to undo.</p>`}
      <div className="match">
        <div className="match-col" role="group" aria-label="Items">${lefts.map((l, i) => {
          const paired = !!response[l]; const ok = reveal && response[l] === correctRight(l);
          return html`<button key=${l} type="button" className=${"mi" + (paired ? " paired" : "") + (active === l ? " active" : "") + (reveal ? (ok ? " right" : " wrong") : "")} style=${{ "--pc": PAIR_COLORS[i % PAIR_COLORS.length] }} disabled=${locked} aria-pressed=${String(active === l)} onClick=${() => clickLeft(l)}>
            <span className="pn">${paired ? i + 1 : ""}</span><span className="grow"><strong>${l}</strong>${reveal && html`<span style=${{ display: "block", fontSize: ".85rem" }} className=${ok ? "" : "muted"}>${ok ? html`<span style=${{ color: "var(--ok)" }}>✓ Correct</span>` : html`<span style=${{ color: "var(--bad)" }}>✕ ${response[l] ? "Your match was wrong" : "Not matched"}</span> · Correct: ${correctRight(l)}`}</span>`}</span></button>`;
        })}</div>
        <div className="match-col" role="group" aria-label="Matches">${rights.map(r => {
          const owner = leftFor(r); const idx = owner ? pairIndex(owner) : -1;
          return html`<button key=${r} type="button" className=${"mi" + (owner ? " paired" : "")} style=${{ "--pc": idx >= 0 ? PAIR_COLORS[idx % PAIR_COLORS.length] : "transparent" }} disabled=${locked} onClick=${() => clickRight(r)}>
            <span className="pn">${owner ? idx + 1 : ""}</span><span className="grow">${r}</span></button>`;
        })}</div>
      </div>
    </div>`;
  }

  // ======================================================================
  // PRACTICE SETUP
  // ======================================================================
  const TYPE_OPTS = [["mixed", "Mixed"], ["mcq", "Multiple Choice"], ["multi", "Multiple Select"], ["fill", "Fill in the Blank"], ["match", "Matching"], ["definition", "Definition Questions"]];
  function TypePicker({ value, onChange }) {
    const toggle = t => {
      if (t === "mixed") return onChange(["mixed"]);
      let v = value.filter(x => x !== "mixed"); v = v.includes(t) ? v.filter(x => x !== t) : v.concat(t);
      onChange(v.length ? v : ["mixed"]);
    };
    return html`<div className="seg" role="group" aria-label="Question types">${TYPE_OPTS.map(([v, l]) => html`<button key=${v} type="button" aria-pressed=${String(value.includes(v))} onClick=${() => toggle(v)}>${l}</button>`)}</div>`;
  }
  function SetPicker({ selected, onChange }) {
    const toggle = id => onChange(selected.includes(id) ? selected.filter(x => x !== id) : selected.concat(id));
    return html`<div className="grid" style=${{ gridTemplateColumns: "repeat(auto-fill, minmax(min(100%, 260px), 1fr))", gap: 8 }}>${C.setsAlpha.map(st => html`<${Check} key=${st.id} on=${selected.includes(st.id)} onChange=${() => toggle(st.id)}><span>${st.name}</span> <span className="faint" style=${{ fontSize: ".8rem" }}>· ${C.qBySet[st.id].length}</span><//>`)}</div>`;
  }
  function PracticeSetup({ s, go, params }) {
    const [scope, setScope] = useState(params.sets && params.sets.length ? "selected" : "all");
    const [sets, setSets] = useState(params.sets || []);
    const [types, setTypes] = useState(["mixed"]);
    const [count, setCount] = useState(10);
    const [difficulty, setDifficulty] = useState("mixed");
    const [o, setO] = useState({ shuffle: s.settings.qOrder === "random", shuffleAnswers: s.settings.aOrder === "random", hints: true, explanations: true, retry: true, prioritizeWeak: true });
    const cfg = { sets: scope === "all" ? [] : sets, types, count, difficulty, ...o };
    const available = S.pool(cfg).length;
    const n = count === "all" ? available : Math.min(count, available);
    const opt = (k, label, desc) => html`<${Toggle} on=${o[k]} onChange=${v => setO({ ...o, [k]: v })} label=${label} desc=${desc} />`;
    return html`<div className="content page">
      <${Crumbs} go=${go} items=${[{ label: "Study", go: "study" }, { label: "Practice" }]} />
      <header className="stack" style=${{ gap: 6 }}><span className="eyebrow">Study mode</span><h1>Practice setup</h1><p className="muted">Immediate feedback after every question. Mistakes come back more often until you've got them.</p></header>
      <section className="card stack"><h3>Topics</h3>
        <${Seg} label="Topic scope" value=${scope} onChange=${setScope} options=${[{ v: "all", l: "All Topics" }, { v: "selected", l: "Selected Topics" }]} />
        ${scope === "selected" && html`<${SetPicker} selected=${sets} onChange=${setSets} />`}
      </section>
      <section className="card stack"><h3>Question types</h3><${TypePicker} value=${types} onChange=${setTypes} /></section>
      <div className="grid g2">
        <section className="card stack"><h3>Number of questions</h3><${Seg} label="Number of questions" value=${count} onChange=${setCount} options=${[5, 10, 15, 20, 30].map(v => ({ v, l: String(v) })).concat({ v: "all", l: "All Available" })} /></section>
        <section className="card stack"><h3>Difficulty</h3><${Seg} label="Difficulty" value=${difficulty} onChange=${setDifficulty} options=${[{ v: "easy", l: "Easy" }, { v: "medium", l: "Medium" }, { v: "hard", l: "Hard" }, { v: "mixed", l: "Mixed" }]} /></section>
      </div>
      <section className="card stack"><h3>Options</h3><div className="grid g2">
        ${opt("shuffle", "Shuffle questions")}${opt("shuffleAnswers", "Shuffle answer choices")}
        ${opt("hints", "Show hints", "Hints halve the XP for that question.")}${opt("explanations", "Show explanations immediately")}
        ${opt("retry", "Retry incorrect questions", "Missed questions return once at the end.")}${opt("prioritizeWeak", "Prioritize weak areas", "Weak topics and missed questions appear more often.")}
      </div></section>
      <div className="row between card tight">
        <span className="muted">${available ? html`<b className="num" style=${{ color: "var(--fg)" }}>${n}</b> question${n === 1 ? "" : "s"} from a pool of ${available}` : "No questions match these settings. Widen the topics, types or difficulty."}</span>
        <button className="btn primary" disabled=${!available || (scope === "selected" && !sets.length)} onClick=${() => go("practice", { config: cfg })}><${Icon} name="play" size=${16} />Start practice</button>
      </div>
    </div>`;
  }

  // ======================================================================
  // PRACTICE SESSION
  // ======================================================================
  function autoHint(q) {
    if (q.hint) return { text: q.hint };
    if (q.type === "mcq" || q.type === "definition") { const wrong = U.shuffle(q.options.filter(o => o !== q.correctAnswer)).slice(0, Math.max(0, q.options.length - 2)); return { text: "Two wrong options have been ruled out.", eliminate: wrong }; }
    if (q.type === "fill") { const a = q.correctAnswer; return { text: `Starts with “${a.charAt(0).toUpperCase()}” and has ${a.replace(/\s/g, "").length} characters.` }; }
    if (q.type === "multi") return { text: `${q.correctAnswers.length} of the options are correct.` };
    if (q.type === "match") return { text: `First pair: ${q.pairs[0].left} → ${q.pairs[0].right}` };
    return { text: "" };
  }
  function PracticeSession({ s, go, params }) {
    const config = params.config || defaultPractice(s);
    const [qs, setQs] = useState(() => S.practice(Store.get(), config).map(q => S.present(q, config.shuffleAnswers)));
    const [idx, setIdx] = useState(0);
    const [resp, setResp] = useState(null);
    const [submitted, setSubmitted] = useState(false);
    const [res, setRes] = useState(null);
    const [run, setRun] = useState(0);
    const [best, setBest] = useState(0);
    const [log, setLog] = useState([]);
    const [hint, setHint] = useState(null);
    const [showExp, setShowExp] = useState(config.explanations);
    const [done, setDone] = useState(false);
    const t0 = useRef(Date.now());
    const contRef = useRef(null);
    const xp = useXpTally();

    useEffect(() => { if (submitted && contRef.current) contRef.current.focus({ preventScroll: true }); }, [submitted]);

    if (!qs.length) return html`<div className="content"><${Empty} icon="pencil" title="No questions available" text="No questions match these practice settings."><button className="btn" onClick=${() => go("practiceSetup", { sets: config.sets })}>Change settings</button><//></div>`;

    const q = qs[idx];
    const submit = r => {
      if (submitted) return;
      const ok = A.check(q, r); const newRun = ok ? run + 1 : 0;
      const out = Actions.practiceAnswer(C.qById[q.id], ok, { usedHint: !!hint, run: newRun });
      Sound.play(ok ? "correct" : "wrong");
      setResp(r); setSubmitted(true); setRes({ ok, ...out }); setRun(newRun); setBest(b => Math.max(b, newRun));
      setLog(l => l.concat({ id: q.id, set: q.set, ok, retry: !!q._retry }));
      if (!ok && config.retry && !q._retry) setQs(list => list.concat({ ...S.present(C.qById[q.id], config.shuffleAnswers), _retry: true }));
      if (!config.explanations) setShowExp(false);
    };
    const next = () => {
      if (idx + 1 >= qs.length) { Actions.finishPractice({ answered: log.length, seconds: Math.round((Date.now() - t0.current) / 1000) }); setDone(true); window.scrollTo(0, 0); return; }
      setIdx(idx + 1); setResp(null); setSubmitted(false); setRes(null); setHint(null); setShowExp(config.explanations); window.scrollTo(0, 0);
    };
    const canSubmit = A.isAnswered(q, resp);
    useKeys(e => {
      if (done) return;
      if (submitted) { if (e.key === "Enter") { e.preventDefault(); next(); } return; }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9 && q.options && n <= q.options.length) {
        const o = q.options[n - 1];
        if (q.type === "mcq" || q.type === "definition") { if (!(hint && hint.eliminate && hint.eliminate.includes(o))) submit(o); }
        else if (q.type === "multi") setResp(prev => { const p = prev || []; return p.includes(o) ? p.filter(x => x !== o) : p.concat(o); });
      } else if (e.key === "Enter" && (q.type === "multi" || q.type === "match") && canSubmit) { e.preventDefault(); submit(resp); }
    });

    if (done) return html`<${PracticeResults} s=${s} go=${go} log=${log} xp=${xp} best=${best} config=${config} />`;

    const firstPass = qs.filter(x => !x._retry).length;
    return html`<div className="content page" style=${{ maxWidth: 860 }}>
      <div className="row between">
        <button className="btn sm ghost" onClick=${() => go("study")}><${Icon} name="arrowL" size=${16} />End practice</button>
        <div className="row" style=${{ gap: 8 }}>${run > 0 && html`<span className="chip warn run" aria-live="polite"><${Icon} name="flame" size=${14} />${run} correct</span>`}<span className="chip xp tnum">+${xp} XP</span></div>
      </div>
      <div className="stack" style=${{ gap: 8 }}>
        <div className="row between"><span className="tag">Question <span className="num tnum">${idx + 1}</span> of <span className="num tnum">${qs.length}</span>${qs.length > firstPass && html`<span className="faint" style=${{ marginLeft: 6, textTransform: "none", letterSpacing: 0, fontFamily: "var(--font-body)", fontWeight: 400 }}>(includes ${qs.length - firstPass} retr${qs.length - firstPass === 1 ? "y" : "ies"})</span>`}</span>
        <div className="row" style=${{ gap: 6 }}><span className="chip accent">${setName(q.set).toUpperCase()}</span><span className=${"chip " + (q.difficulty === "hard" ? "bad" : q.difficulty === "medium" ? "warn" : "ok")}>${q.difficulty.toUpperCase()}</span><span className="chip">${C.typeLabels[q.type]}</span>${q._retry && html`<span className="chip xp">Retry</span>`}</div></div>
        <${Bar} pct=${idx / qs.length * 100} label="Practice progress" />
      </div>
      <section key=${idx} className=${"card stack" + (submitted ? (res.ok ? " pulse-ok" : " shake") : "")} style=${{ padding: 24 }}>
        <${QuestionBody} q=${q} response=${resp} onChange=${setResp} onCommit=${(q.type === "mcq" || q.type === "definition" || q.type === "fill") ? submit : null} reveal=${submitted} locked=${submitted} eliminated=${hint && hint.eliminate || []} />
        ${hint && !submitted && html`<div className="hintbox"><${Icon} name="bulb" /><span>${hint.text}</span></div>`}
        ${!submitted && html`<div className="row between">
          ${config.hints ? html`<button className="btn sm ghost" disabled=${!!hint} onClick=${() => setHint(autoHint(q))}><${Icon} name="bulb" size=${16} />${hint ? "Hint used" : "Show hint"}</button>` : html`<span></span>`}
          ${(q.type === "multi" || q.type === "match" || q.type === "fill") && html`<button className="btn primary" disabled=${!canSubmit} onClick=${() => submit(resp)}>Submit answer</button>`}
          ${(q.type === "mcq" || q.type === "definition") && html`<span className="faint" style=${{ fontSize: ".85rem" }}>Press <kbd>1</kbd>–<kbd>${q.options.length}</kbd> to answer</span>`}
        </div>`}
        ${submitted && html`<div className=${"feedback " + (res.ok ? "ok" : "bad")} role="status">
          <div className="row between"><span className="verdict"><${Icon} name=${res.ok ? "check" : "x"} size=${24} stroke=${3} />${res.ok ? "Correct" : "Incorrect"}</span>
            ${res.ok && html`<span className="num" style=${{ color: "var(--xp)", fontSize: "1.2rem" }}>${res.xp ? "+" + res.xp + " XP" : res.already ? "+0 XP · earned today" : ""}${res.bonus ? html` <span className="chip warn" style=${{ marginLeft: 6 }}>Streak +${res.bonus}</span>` : ""}</span>`}</div>
          ${!res.ok && html`<div><span className="faint">Correct answer: </span><strong>${A.correctText(q)}</strong></div>`}
          ${showExp ? html`<p>${q.explanation}</p>` : html`<button className="link" style=${{ justifySelf: "start" }} onClick=${() => setShowExp(true)}>Show explanation</button>`}
          ${!res.ok && config.retry && !q._retry && html`<span className="faint" style=${{ fontSize: ".86rem" }}>This question will come back at the end of the session.</span>`}
          <div className="row" style=${{ justifyContent: "flex-end" }}><button ref=${contRef} className="btn primary" onClick=${next}>${idx + 1 >= qs.length ? "Finish" : "Continue"} <${Icon} name="arrowR" size=${16} /></button></div>
        </div>`}
      </section>
    </div>`;
  }
  function PracticeResults({ s, go, log, xp, best, config }) {
    const first = log; const correct = first.filter(x => x.ok).length; const acc = first.length ? Math.round(correct / first.length * 100) : 0;
    const bySet = {}; first.forEach(x => { const b = bySet[x.set] || (bySet[x.set] = { set: x.set, c: 0, t: 0 }); b.t++; if (x.ok) b.c++; });
    const ranked = Object.values(bySet).sort((a, b) => b.c / b.t - a.c / a.t || b.t - a.t);
    const strongest = ranked[0], weakest = ranked.length > 1 ? ranked[ranked.length - 1] : null;
    const missed = [...new Set(first.filter(x => !x.ok).map(x => x.id))].filter(id => !first.some(y => y.id === id && y.ok && y.retry));
    const weakSet = (weakest || strongest || {}).set || (M.recommendation(s) || {}).set?.id;
    return html`<div className="content page" style=${{ maxWidth: 860 }}>
      <section className="card stack" style=${{ padding: 30 }}>
        <span className="eyebrow">Session complete</span>
        <h1>${acc >= 90 ? "Outstanding session." : acc >= 70 ? "Solid session." : "Good effort. Keep going."}</h1>
        <div className="grid g4">
          <${Stat} value=${first.length} label="Questions" /><${Stat} value=${correct} label="Correct" tone="ok" />
          <${Stat} value=${acc + "%"} label="Accuracy" tone="accent" /><${Stat} value=${"+" + xp} label="XP Earned" tone="xp" />
        </div>
        <div className="grid g3">
          <div className="panel"><div className="eyebrow">Best streak</div><div className="row" style=${{ gap: 6, color: "var(--warn)" }}><${Icon} name="flame" /><span className="num" style=${{ fontSize: "1.6rem" }}>${best}</span></div></div>
          <div className="panel"><div className="eyebrow">Strongest topic</div><div style=${{ fontWeight: 600 }}>${strongest ? setName(strongest.set) : "—"}</div>${strongest && html`<div className="faint tnum">${strongest.c}/${strongest.t} correct</div>`}</div>
          <div className="panel"><div className="eyebrow">Weakest topic</div><div style=${{ fontWeight: 600 }}>${weakest ? setName(weakest.set) : "—"}</div>${weakest && html`<div className="faint tnum">${weakest.c}/${weakest.t} correct</div>`}</div>
        </div>
        <div className="row">
          <button className="btn primary" disabled=${!missed.length} onClick=${() => go("practice", { config: { ...config, questionIds: missed, count: "all", shuffle: true } })}><${Icon} name="rotate" size=${16} />Retry missed${missed.length ? ` (${missed.length})` : ""}</button>
          <button className="btn" disabled=${!weakSet} onClick=${() => go("practice", { config: defaultPractice(s, { sets: [weakSet], prioritizeWeak: true }) })}><${Icon} name="target" size=${16} />Practice weak area</button>
          <button className="btn ghost" onClick=${() => go("home")}><${Icon} name="home" size=${16} />Return home</button>
        </div>
      </section>
      <section className="card stack"><h3>Answers this session</h3>
        ${first.map((x, i) => { const q = C.qById[x.id]; return html`<div key=${i} className="row nowrap" style=${{ alignItems: "flex-start", gap: 10, padding: "6px 0", borderBottom: "1px solid var(--line)" }}><span className=${"chip " + (x.ok ? "ok" : "bad")}><${Icon} name=${x.ok ? "check" : "x"} size=${12} stroke=${3} />${x.ok ? "Correct" : "Incorrect"}</span><span className="grow">${q.prompt ? q.question + " " + q.prompt : q.question}${x.retry ? html` <span className="chip xp">Retry</span>` : ""}</span></div>`; })}
      </section>
    </div>`;
  }

  // ======================================================================
  // TEST SETUP
  // ======================================================================
  function TestSetup({ s, go }) {
    const [sets, setSets] = useState(C.sets.map(x => x.id));
    const [types, setTypes] = useState(["mixed"]);
    const [count, setCount] = useState(20);
    const [difficulty, setDifficulty] = useState("mixed");
    const [timer, setTimer] = useState(0);
    const [custom, setCustom] = useState(15);
    const cfg = { sets, types, count, difficulty };
    const available = sets.length ? S.pool(cfg).length : 0;
    const n = count === "all" ? available : Math.min(count, available);
    const timerMin = timer === "custom" ? U.clamp(Number(custom) || 0, 1, 240) : timer;
    const last = s.tests[0];
    return html`<div className="content page">
      <header className="stack" style=${{ gap: 6 }}><span className="eyebrow">Test mode</span><h1>Test setup</h1><p className="muted">This is the exam. You won't see answers, correctness or explanations until you submit the whole test.</p></header>
      <section className="card stack">
        <div className="row between"><h3>Test topics</h3><div className="row" style=${{ gap: 8 }}><button className="btn sm" onClick=${() => setSets(C.sets.map(x => x.id))}>Select all</button><button className="btn sm ghost" onClick=${() => setSets([])}>Deselect all</button></div></div>
        <${SetPicker} selected=${sets} onChange=${setSets} />
      </section>
      <section className="card stack"><h3>Question types</h3><${TypePicker} value=${types} onChange=${setTypes} /></section>
      <div className="grid g2">
        <section className="card stack"><h3>Test length</h3><${Seg} label="Test length" value=${count} onChange=${setCount} options=${[5, 10, 20, 30, 50].map(v => ({ v, l: v + " Questions" })).concat({ v: "all", l: "All Available" })} /></section>
        <section className="card stack"><h3>Difficulty</h3><${Seg} label="Difficulty" value=${difficulty} onChange=${setDifficulty} options=${[{ v: "easy", l: "Easy" }, { v: "medium", l: "Medium" }, { v: "hard", l: "Hard" }, { v: "mixed", l: "Mixed" }]} /></section>
      </div>
      <section className="card stack"><h3>Timer</h3>
        <${Seg} label="Timer" value=${timer} onChange=${setTimer} options=${[{ v: 0, l: "No Timer" }, { v: 5, l: "5 Minutes" }, { v: 10, l: "10 Minutes" }, { v: 20, l: "20 Minutes" }, { v: 30, l: "30 Minutes" }, { v: "custom", l: "Custom" }]} />
        ${timer === "custom" && html`<div className="row"><label htmlFor="custom-min">Minutes</label><input id="custom-min" className="input" style=${{ width: 120 }} type="number" min="1" max="240" value=${custom} onInput=${e => setCustom(e.target.value)} /></div>`}
        ${timerMin > 0 && html`<p className="faint" style=${{ fontSize: ".88rem" }}>The test submits automatically when time runs out.</p>`}
      </section>
      <div className="row between card tight">
        <span className="muted">${!sets.length ? "Select at least one topic." : available ? html`<b className="num" style=${{ color: "var(--fg)" }}>${n}</b> questions from ${sets.length} topic${sets.length === 1 ? "" : "s"} · ${timerMin ? timerMin + " min" : "untimed"}` : "No questions match. Widen the types or difficulty."}</span>
        <button className="btn primary" disabled=${!available} onClick=${() => go("test", { config: { ...cfg, timerMin } })}><${Icon} name="play" size=${16} />Begin test</button>
      </div>
      ${last && html`<p className="faint">Last test: ${last.pct}% (${last.correct}/${last.total}) on ${U.fmtShort(last.ts)}. <button className="link" onClick=${() => go("testResults", { id: last.id })}>View results</button></p>`}
    </div>`;
  }

  // ======================================================================
  // TEST SESSION (no correctness feedback until submission)
  // ======================================================================
  function TestSession({ s, go, params, setGuard }) {
    const config = params.config;
    const [qs] = useState(() => S.test(config, Store.get().settings.qOrder === "original").map(q => S.present(q, Store.get().settings.aOrder === "random")));
    const [responses, setResponses] = useState(() => qs.map(() => null));
    const [flags, setFlags] = useState(() => qs.map(() => false));
    const [idx, setIdx] = useState(0);
    const [now, setNow] = useState(Date.now());
    const [confirm, setConfirm] = useState(false);
    const t0 = useRef(Date.now());
    const submittedRef = useRef(false);
    const limitSec = (config.timerMin || 0) * 60;

    useEffect(() => { setGuard(true); return () => setGuard(false); }, []);
    useEffect(() => { const t = setInterval(() => setNow(Date.now()), 500); return () => clearInterval(t); }, []);
    const elapsed = (now - t0.current) / 1000;
    const remaining = limitSec ? limitSec - elapsed : null;

    const doSubmit = useCallback((timedOut) => {
      if (submittedRef.current) return; submittedRef.current = true;
      const rec = Actions.submitTest({ questions: qs, responses, flags, seconds: Math.min(limitSec || Infinity, Math.round((Date.now() - t0.current) / 1000)), limitSec, timedOut });
      Sound.play("submit"); setGuard(false);
      go("testResults", { id: rec.id, fresh: true, timedOut });
    }, [qs, responses, flags]);
    useEffect(() => { if (limitSec && remaining <= 0) doSubmit(true); }, [remaining]);

    if (!qs.length) return html`<div className="content"><${Empty} icon="clipboard" title="No questions available" text="No questions match this test's settings."><button className="btn" onClick=${() => { setGuard(false); go("testSetup"); }}>Back to setup</button><//></div>`;

    const q = qs[idx];
    const setR = r => setResponses(v => { const n = v.slice(); n[idx] = typeof r === "function" ? r(v[idx]) : r; return n; });
    const toggleFlag = () => setFlags(v => { const n = v.slice(); n[idx] = !n[idx]; return n; });
    const answered = responses.map((r, i) => A.isAnswered(qs[i], r));
    const unanswered = answered.filter(x => !x).length;
    const flaggedIdx = flags.map((f, i) => f ? i : -1).filter(i => i >= 0);
    const nextFlag = () => { if (!flaggedIdx.length) return; const n = flaggedIdx.find(i => i > idx); setIdx(n != null ? n : flaggedIdx[0]); setConfirm(false); };
    const askSubmit = () => setConfirm(true);
    useKeys(e => {
      if (confirm) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9 && q.options && n <= q.options.length) {
        const o = q.options[n - 1];
        if (q.type === "mcq" || q.type === "definition") setR(o);
        else if (q.type === "multi") setR(prev => { const p = prev || []; return p.includes(o) ? p.filter(x => x !== o) : p.concat(o); });
      } else if (e.key === "f" || e.key === "F") toggleFlag();
      else if (e.key === "ArrowLeft") setIdx(i => Math.max(0, i - 1));
      else if (e.key === "ArrowRight") setIdx(i => Math.min(qs.length - 1, i + 1));
    });

    return html`<div className="content page">
      <div className="row between">
        <div className="stack" style=${{ gap: 2 }}><span className="eyebrow">Test in progress</span><span className="tag" style=${{ fontSize: "1.1rem" }}>Question <span className="num tnum">${idx + 1}</span> of <span className="num tnum">${qs.length}</span></span></div>
        <div className="row" style=${{ gap: 10 }}>
          ${limitSec ? html`<span className=${"timer" + (remaining < 60 ? " low" : "")} role="timer" aria-label="Time remaining"><${Icon} name="clock" size=${20} />${U.fmtClock(remaining)}</span>` : html`<span className="timer" style=${{ fontSize: "1.1rem" }}><${Icon} name="clock" size=${18} />${U.fmtClock(elapsed)}</span>`}
          <button className="btn primary" onClick=${askSubmit}>Submit test</button>
        </div>
      </div>
      <${Bar} pct=${answered.filter(Boolean).length / qs.length * 100} fill="var(--accent-2)" label="Questions answered" />
      <div className="grid" style=${{ gridTemplateColumns: "minmax(0, 1fr)", gap: 18 }}>
        <section key=${idx} className="card stack" style=${{ padding: 24 }}>
          <div className="row between"><div className="row" style=${{ gap: 6 }}><span className="chip">${setName(q.set)}</span><span className="chip">${C.typeLabels[q.type]}</span></div>
            <button className="btn sm" aria-pressed=${String(flags[idx])} style=${flags[idx] ? { borderColor: "var(--warn)", color: "var(--warn)", background: "var(--warn-soft)" } : null} onClick=${toggleFlag}><${Icon} name="flag" size=${16} />${flags[idx] ? "Flagged" : "Flag question"}</button></div>
          <${QuestionBody} q=${q} response=${responses[idx]} onChange=${setR} reveal=${false} locked=${false} />
          <div className="row between">
            <button className="btn" disabled=${idx === 0} onClick=${() => setIdx(idx - 1)}><${Icon} name="chevL" size=${18} />Previous</button>
            <span className="faint" style=${{ fontSize: ".82rem" }}><kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag${q.options && (q.type === "mcq" || q.type === "definition") ? html` · <kbd>1</kbd>–<kbd>${q.options.length}</kbd> answer` : ""}</span>
            ${idx < qs.length - 1 ? html`<button className="btn" onClick=${() => setIdx(idx + 1)}>Next<${Icon} name="chevR" size=${18} /></button>` : html`<button className="btn primary" onClick=${askSubmit}>Finish</button>`}
          </div>
        </section>
        <section className="card stack">
          <div className="row between"><h3>Question navigator</h3>${flaggedIdx.length > 0 && html`<button className="btn sm" style=${{ borderColor: "var(--warn)", color: "var(--warn)" }} onClick=${nextFlag}><${Icon} name="flag" size=${14} />Review flagged questions (${flaggedIdx.length})</button>`}</div>
          <div className="navgrid">${qs.map((_, i) => html`<button key=${i} className=${(answered[i] ? "ans " : "") + (flags[i] ? "flag " : "") + (i === idx ? "cur" : "")} aria-label=${`Question ${i + 1}${answered[i] ? ", answered" : ", unanswered"}${flags[i] ? ", flagged" : ""}`} aria-current=${i === idx ? "step" : undefined} onClick=${() => setIdx(i)}>${i + 1}</button>`)}</div>
          <div className="legend"><span><i style=${{ background: "var(--card-2)", border: "1px solid var(--line-2)" }}></i>Unanswered</span><span><i style=${{ background: "color-mix(in srgb, var(--accent-2) 40%, var(--card-2))" }}></i>Answered</span><span><i style=${{ background: "var(--warn)" }}></i>Flagged</span><span className="tnum">${unanswered} unanswered</span></div>
        </section>
      </div>
      ${confirm && html`<${Modal} label="Submit test" onClose=${() => setConfirm(false)}>
        <h2>Submit test?</h2>
        ${unanswered > 0 ? html`<p style=${{ fontSize: "1.05rem" }}>You still have <b>${unanswered}</b> unanswered question${unanswered === 1 ? "" : "s"}.</p>` : html`<p className="muted">All ${qs.length} questions answered. You can't change answers after submitting.</p>`}
        ${flaggedIdx.length > 0 && html`<p className="muted">${flaggedIdx.length} question${flaggedIdx.length === 1 ? " is" : "s are"} flagged for review.</p>`}
        <div className="row" style=${{ justifyContent: "flex-end" }}>
          ${flaggedIdx.length > 0 && html`<button className="btn" onClick=${nextFlag}><${Icon} name="flag" size=${16} />Review flagged questions</button>`}
          <button className="btn" autoFocus onClick=${() => setConfirm(false)}>Return to test</button>
          <button className="btn primary" onClick=${() => doSubmit(false)}>${unanswered > 0 ? "Submit anyway" : "Submit test"}</button>
        </div>
      <//>`}
    </div>`;
  }

  // ======================================================================
  // TEST RESULTS + REVIEW
  // ======================================================================
  function TestResults({ s, go, params }) {
    const rec = s.tests.find(t => t.id === params.id);
    const [filter, setFilter] = useState("all");
    if (!rec) return html`<div className="content"><${Empty} icon="clipboard" title="Test not found" text="This test result is no longer stored."><button className="btn" onClick=${() => go("progress")}>Back to progress</button><//></div>`;
    const ringColor = rec.pct >= 90 ? "var(--ok)" : rec.pct >= 75 ? "var(--accent)" : rec.pct >= 60 ? "var(--warn)" : "var(--bad)";
    const weakSets = rec.bySet.filter(b => b.c / b.t < 0.8).map(b => b.set);
    const missed = [...new Set(rec.items.filter(x => !x.ok).map(x => x.qid))].filter(id => C.qById[id]);
    const practiceWeak = () => {
      const sets = weakSets.length ? weakSets : rec.bySet.slice().sort((a, b) => a.c / a.t - b.c / b.t).slice(0, 1).map(b => b.set);
      const extra = S.practice(Store.get(), { sets, types: ["mixed"], difficulty: "mixed", count: Math.max(0, 10 - missed.length), prioritizeWeak: true, shuffle: true }).map(q => q.id).filter(id => !missed.includes(id));
      go("practice", { config: defaultPractice(s, { sets, questionIds: U.shuffle(missed).concat(extra), count: "all", shuffle: false }) });
    };
    const items = rec.items.map((x, i) => ({ ...x, n: i + 1 })).filter(x => filter === "all" || (filter === "wrong" && !x.ok) || (filter === "flagged" && x.flagged));
    return html`<div className="content page">
      <${Crumbs} go=${go} items=${[{ label: "Progress", go: "progress" }, { label: "Test #" + rec.n }]} />
      <section className="card row" style=${{ gap: 28, padding: 28 }}>
        <div className="score-ring" style=${{ "--p": rec.pct, "--ring": ringColor }} role="img" aria-label=${"Score " + rec.pct + " percent"}><div><div><div className="num" style=${{ fontSize: "2.6rem", lineHeight: 1 }}>${rec.pct}%</div><div className="tag faint">Grade ${rec.grade}</div></div></div></div>
        <div className="grow stack" style=${{ minWidth: 240 }}>
          <span className="eyebrow">${params.fresh ? (params.timedOut ? "Time's up · test complete" : "Test complete") : "Test #" + rec.n + " · " + U.fmtDate(rec.ts)}</span>
          <h1>${rec.correct} / ${rec.total}</h1>
          <p style=${{ fontSize: "1.08rem" }}>${X.message(rec.pct)}</p>
          <div className="grid g4" style=${{ gap: 10 }}>
            <div className="panel"><div className="eyebrow">XP earned</div><div className="num" style=${{ fontSize: "1.5rem", color: "var(--xp)" }}>+${rec.xp}</div></div>
            <div className="panel"><div className="eyebrow">Correct</div><div className="num" style=${{ fontSize: "1.5rem", color: "var(--ok)" }}>${rec.correct}</div></div>
            <div className="panel"><div className="eyebrow">Incorrect</div><div className="num" style=${{ fontSize: "1.5rem", color: "var(--bad)" }}>${rec.total - rec.correct}</div></div>
            <div className="panel"><div className="eyebrow">Time</div><div className="num tnum" style=${{ fontSize: "1.5rem" }}>${U.fmtTime(rec.seconds)}</div></div>
          </div>
          <div className="row" style=${{ gap: 8 }}><span className="chip warn"><${Icon} name="flame" size=${14} />Best answer streak: ${rec.bestRun}</span><span className="chip">Grade ${rec.grade}</span>${rec.limitSec ? html`<span className="chip"><${Icon} name="clock" size=${14} />${Math.round(rec.limitSec / 60)} min limit</span>` : null}${rec.total < 5 ? html`<span className="chip">Tests under 5 questions earn no XP</span>` : rec.total < 10 ? html`<span className="chip">Score bonuses need 10+ questions</span>` : null}</div>
        </div>
      </section>

      <section className="card stack">
        <div className="row between"><h3>Performance by topic</h3><button className="btn primary" onClick=${practiceWeak}><${Icon} name="target" size=${16} />Practice weak areas</button></div>
        ${rec.bySet.slice().sort((a, b) => a.c / a.t - b.c / b.t).map(b => { const p = Math.round(b.c / b.t * 100); const l = M.pctLabel(p); return html`<div key=${b.set} className="stack" style=${{ gap: 6 }}>
          <div className="row between"><span style=${{ fontWeight: 600 }}>${setName(b.set)}</span><span className="row" style=${{ gap: 10 }}><span className="faint tnum">${b.c}/${b.t}</span><span className="num tnum">${p}%</span><span className=${"mastery-pill m-" + l.key}>${l.text}</span></span></div>
          <${Bar} pct=${p} fill=${`var(--${l.key === "mastered" ? "ok" : l.key === "strong" ? "accent" : l.key === "learning" ? "warn" : "bad"})`} label=${setName(b.set)} /></div>`; })}
      </section>

      <section className="card stack">
        <div className="row between"><h3>Review answers</h3><${Seg} label="Filter review" value=${filter} onChange=${setFilter} options=${[{ v: "all", l: "All " + rec.total }, { v: "wrong", l: "Incorrect " + (rec.total - rec.correct) }, { v: "flagged", l: "Flagged " + rec.items.filter(x => x.flagged).length }]} /></div>
        ${!items.length && html`<p className="faint">Nothing to show for this filter.</p>`}
        ${items.map(x => html`<article key=${x.n} className="review-item">
          <div className="row between"><span className="tag faint">Question ${x.n}</span><span className="row" style=${{ gap: 6 }}>${x.flagged && html`<span className="chip warn"><${Icon} name="flag" size=${12} />Flagged</span>`}<span className=${"chip " + (x.ok ? "ok" : "bad")}><${Icon} name=${x.ok ? "check" : "x"} size=${12} stroke=${3} />${x.ok ? "Correct" : "Incorrect"}</span></span></div>
          <div style=${{ fontWeight: 600, fontSize: "1.05rem" }}>${x.question}${x.prompt && html`<div className="q-prompt" style=${{ marginTop: 8, fontWeight: 400, fontSize: ".98rem" }}>${x.prompt}</div>`}</div>
          <dl className="kv">
            <dt>Your answer</dt><dd style=${{ color: x.ok ? "var(--ok)" : x.answered ? "var(--bad)" : "var(--fg-3)" }}>${x.ok ? "✓ " : x.answered ? "✕ " : ""}${x.yours}</dd>
            <dt>Correct answer</dt><dd>${x.correct}</dd>
            <dt>Explanation</dt><dd className="muted">${x.explanation}</dd>
            <dt>Topic</dt><dd>${setName(x.set)} · ${x.topic}</dd>
            <dt>Difficulty</dt><dd>${C.diffLabels[x.difficulty]}</dd>
          </dl>
        </article>`)}
      </section>
      <div className="row"><button className="btn" onClick=${() => go("testSetup")}>New test</button><button className="btn ghost" onClick=${() => go("home")}>Return home</button></div>
    </div>`;
  }

  // ======================================================================
  // PROGRESS
  // ======================================================================
  function Progress({ s, go }) {
    const o = V.overall(s), lp = X.progress(s.profile.xp), streak = V.currentStreak(s);
    const wrongLatest = Object.keys(s.questions).filter(id => C.qById[id] && s.questions[id].lastOk === false);
    return html`<div className="content page">
      <header className="stack" style=${{ gap: 6 }}><span className="eyebrow">Analytics</span><h1>Progress</h1></header>
      <div className="grid gstats">
        <${Stat} value=${o.acc + "%"} label="Overall Accuracy" tone="accent" /><${Stat} value=${o.pAcc + "%"} label="Study Accuracy" /><${Stat} value=${o.tAcc + "%"} label="Test Accuracy" />
        <${Stat} value=${U.num(s.stats.answered)} label="Questions Answered" /><${Stat} value=${U.num(s.stats.correct)} label="Questions Correct" tone="ok" />
        <${Stat} value=${U.num(s.stats.cardsReviewed)} label="Flashcards Reviewed" /><${Stat} value=${o.knownCards + " / " + C.cards.length} label="Known Flashcards" tone="ok" />
        <${Stat} value=${s.stats.testsCompleted} label="Tests Taken" /><${Stat} value=${o.avgTest + "%"} label="Average Test Score" /><${Stat} value=${o.bestTest + "%"} label="Highest Test Score" />
        <${Stat} value=${s.stats.studySessions} label="Study Sessions" /><${Stat} value=${U.fmtTime(s.stats.studyTimeSec)} label="Total Study Time" /><${Stat} value=${U.fmtTime(s.stats.testTimeSec)} label="Total Test Time" />
        <${Stat} value=${U.num(s.profile.xp)} label="XP" tone="xp" /><${Stat} value=${lp.level} label="Level" tone="xp" />
        <${Stat} value=${streak} label="Current Streak" tone="warn" /><${Stat} value=${s.streak.longest} label="Longest Streak" /><${Stat} value=${o.mastered + " / " + C.sets.length} label="Topics Mastered" />
      </div>

      <section className="card stack">
        <div className="row between"><h3>Topic mastery</h3><span className="faint" style=${{ fontSize: ".85rem" }}>Select a topic for detailed analytics</span></div>
        <div className="stack" style=${{ gap: 4 }}>${C.setsAlpha.map(st => { const m = M.setMastery(s, st.id), act = M.setActivity(s, st.id); return html`<button key=${st.id} className="toggle" style=${{ display: "grid", gap: 6, gridTemplateColumns: "minmax(0,1fr)" }} onClick=${() => go("topic", { id: st.id })}>
          <span className="row between"><span style=${{ fontWeight: 600 }}>${st.name}</span><span className="row" style=${{ gap: 10 }}><span className="num tnum">${m}%</span><${MasteryPill} pct=${m} started=${act.started} /></span></span><${Bar} pct=${m} cls="sm" label=${st.name} /></button>`; })}</div>
        <p className="faint" style=${{ fontSize: ".85rem" }}>Mastery blends your last few answers on every question in a set (75%) with your flashcard ratings (25%). Each question needs two recent correct answers to count fully, so one lucky answer never marks a set Mastered.</p>
      </section>

      <div className="grid g2">
        <section className="card stack"><h3>Weekly activity</h3><${WeekChart} s=${s} /></section>
        <section className="card stack">
          <div className="row between"><h3>Test history</h3><button className="btn sm" onClick=${() => go("testSetup")}>New test</button></div>
          ${s.tests.length ? s.tests.slice(0, 8).map(t => html`<button key=${t.id} className="toggle" style=${{ gap: 14 }} onClick=${() => go("testResults", { id: t.id })}>
            <span className="num" style=${{ fontSize: "1.5rem", width: 64, color: t.pct >= 80 ? "var(--ok)" : t.pct >= 60 ? "var(--warn)" : "var(--bad)" }}>${t.pct}%</span>
            <span className="grow" style=${{ minWidth: 0 }}><span className="tag">Test #${t.n}</span> <span className="faint tnum">${t.correct} / ${t.total}</span><br/><span className="faint" style=${{ fontSize: ".85rem" }}>${t.sets.length > 3 ? t.sets.length + " topics" : t.sets.map(setName).join(", ")}</span></span>
            <span className="faint" style=${{ fontSize: ".85rem", textAlign: "right" }}>${U.fmtShort(t.ts)}<br/>${U.fmtTime(t.seconds)}</span></button>`)
          : html`<div className="empty" style=${{ padding: 16 }}><h3>No tests yet</h3><p className="muted">Complete your first test to see your results here.</p><button className="btn primary" onClick=${() => go("testSetup")}>Start test</button></div>`}
        </section>
      </div>

      <section className="card stack">
        <div className="row between"><h3>Question history</h3><div className="row" style=${{ gap: 8 }}><button className="btn sm primary" disabled=${!wrongLatest.length} onClick=${() => go("practice", { config: defaultPractice(s, { questionIds: wrongLatest, count: "all" }) })}><${Icon} name="rotate" size=${14} />Retry incorrect questions (${wrongLatest.length})</button><button className="btn sm" onClick=${() => go("history")}>Full history</button></div></div>
        <${HistoryList} s=${s} limit=${8} />
      </section>
    </div>`;
  }
  function HistoryList({ s, limit }) {
    const rows = s.history.slice(0, limit);
    if (!rows.length) return html`<p className="faint">No questions answered yet. Your practice and test answers will appear here.</p>`;
    return html`<div style=${{ overflowX: "auto" }}><table style=${{ width: "100%", borderCollapse: "collapse", fontSize: ".92rem" }}>
      <thead><tr className="eyebrow" style=${{ textAlign: "left" }}><th style=${{ padding: "8px 6px" }}>Result</th><th style=${{ padding: "8px 6px" }}>Question</th><th style=${{ padding: "8px 6px" }}>Topic</th><th style=${{ padding: "8px 6px" }}>Mode</th><th style=${{ padding: "8px 6px" }}>Attempts</th><th style=${{ padding: "8px 6px" }}>Date</th></tr></thead>
      <tbody>${rows.map((h, i) => { const q = C.qById[h.qid]; if (!q) return null; const st = s.questions[h.qid] || {}; return html`<tr key=${i} style=${{ borderTop: "1px solid var(--line)" }}>
        <td style=${{ padding: "8px 6px" }}><span className=${"chip " + (h.ok ? "ok" : "bad")}><${Icon} name=${h.ok ? "check" : "x"} size=${12} stroke=${3} />${h.ok ? "Correct" : "Incorrect"}</span></td>
        <td style=${{ padding: "8px 6px", minWidth: 240 }}>${q.prompt ? q.question + " " + q.prompt : q.question}</td>
        <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }} className="muted">${setName(q.set)}</td>
        <td style=${{ padding: "8px 6px" }} className="muted">${h.mode === "test" ? "Test" : "Practice"}</td>
        <td style=${{ padding: "8px 6px" }} className="tnum">${st.a || 1} (${st.c || 0} ✓)</td>
        <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }} className="faint">${U.fmtShort(h.ts)}</td></tr>`; })}</tbody></table></div>`;
  }
  function QuestionHistory({ s, go }) {
    const wrongLatest = Object.keys(s.questions).filter(id => C.qById[id] && s.questions[id].lastOk === false);
    return html`<div className="content page">
      <${Crumbs} go=${go} items=${[{ label: "Progress", go: "progress" }, { label: "Question history" }]} />
      <header className="row between"><div className="stack" style=${{ gap: 6 }}><span className="eyebrow">Last ${Math.min(200, s.history.length)} answers</span><h1>Question history</h1></div>
        <button className="btn primary" disabled=${!wrongLatest.length} onClick=${() => go("practice", { config: defaultPractice(s, { questionIds: wrongLatest, count: "all" }) })}><${Icon} name="rotate" size=${16} />Retry incorrect questions (${wrongLatest.length})</button></header>
      <section className="card"><${HistoryList} s=${s} limit=${200} /></section>
    </div>`;
  }
  function TopicAnalytics({ s, go, params }) {
    const set = C.setById[params.id];
    if (!set) return html`<div className="content"><${Empty} title="Topic not found" text="This topic doesn't exist."><button className="btn" onClick=${() => go("progress")}>Back</button><//></div>`;
    const m = M.setMastery(s, set.id), act = M.setActivity(s, set.id), cc = cardCounts(s, C.cardsBySet[set.id]);
    const topics = {}; C.qBySet[set.id].forEach(q => { const t = topics[q.topic] || (topics[q.topic] = { a: 0, c: 0, n: 0 }); t.n++; const st = s.questions[q.id]; if (st) { t.a += st.a; t.c += st.c; } });
    const hist = s.history.filter(h => h.set === set.id).slice(0, 10);
    return html`<div className="content page">
      <${Crumbs} go=${go} items=${[{ label: "Progress", go: "progress" }, { label: set.name }]} />
      <header className="row between"><div className="stack" style=${{ gap: 6 }}><span className="eyebrow">Topic analytics</span><h1>${set.name}</h1></div><div className="row"><button className="btn" onClick=${() => go("set", { id: set.id })}>Open set</button><button className="btn primary" onClick=${() => go("practice", { config: defaultPractice(s, { sets: [set.id] }) })}>Practice</button></div></header>
      <div className="grid g4"><${Stat} value=${m + "%"} label="Mastery" tone="accent" /><${Stat} value=${act.attempts ? Math.round(act.correct / act.attempts * 100) + "%" : "—"} label="Accuracy" /><${Stat} value=${act.attempts} label="Attempts" /><${Stat} value=${act.seen + " / " + act.total} label="Questions tried" /></div>
      <div className="grid g2">
        <section className="card stack"><h3>Subtopics</h3>${Object.keys(topics).map(k => { const t = topics[k]; const p = t.a ? Math.round(t.c / t.a * 100) : 0; return html`<div key=${k} className="stack" style=${{ gap: 4 }}><div className="row between"><span>${k} <span className="faint" style=${{ fontSize: ".82rem" }}>· ${t.n} q</span></span><span className="num tnum">${t.a ? p + "%" : "—"}</span></div><${Bar} pct=${p} cls="sm" fill=${t.a ? (p >= 70 ? "var(--ok)" : p >= 40 ? "var(--warn)" : "var(--bad)") : "var(--card-3)"} label=${k} /></div>`; })}</section>
        <section className="card stack"><h3>Flashcards</h3>
          ${C.cardsBySet[set.id].length ? html`<div className="grid g2"><${Stat} value=${cc.known} label="Known" tone="ok" /><${Stat} value=${cc.learning} label="Learning" tone="warn" /><${Stat} value=${cc.needs} label="Needs Practice" tone="bad" /><${Stat} value=${cc.new} label="New" /></div>` : html`<p className="faint">No flashcards in this set.</p>`}
          <h3 style=${{ marginTop: 8 }}>Recent answers</h3>
          ${hist.length ? hist.map((h, i) => { const q = C.qById[h.qid]; return q && html`<div key=${i} className="row nowrap" style=${{ gap: 8, alignItems: "flex-start" }}><span className=${"chip " + (h.ok ? "ok" : "bad")}><${Icon} name=${h.ok ? "check" : "x"} size=${12} stroke=${3} /></span><span className="grow" style=${{ fontSize: ".9rem" }}>${q.prompt || q.question}</span></div>`; }) : html`<p className="faint">No answers yet.</p>`}
        </section>
      </div>
    </div>`;
  }

  // ======================================================================
  // ACHIEVEMENTS
  // ======================================================================
  function Achievements({ s }) {

    return html`<div className="content page">
      <header className="row between"><div className="stack" style=${{ gap: 6 }}><span className="eyebrow">Trophy room</span><h1>Achievements</h1></div><span className="chip gold" style=${{ fontSize: ".95rem", padding: "6px 14px" }}><${Icon} name="trophy" size=${16} />${unlocked} / ${ACH.length} unlocked</span></header>
      ${!unlocked && html`<div className="banner"><${Icon} name="sparkles" />No achievements unlocked yet. Finish a flashcard or practice session to earn First Steps.</div>`}
      <div className="grid gauto">${ACH.map(a => {
        const ts = s.achievements[a.id]; const [v, goal] = a.prog(s); const p = Math.min(100, v / goal * 100);
        return html`<article key=${a.id} className=${"card ach" + (ts ? "" : " locked")}>
          <div className="medal">${ts ? html`<${Icon} name=${a.icon} size=${28} />` : html`<${Icon} name="lock" size=${24} />`}</div>
          <div className="stack" style=${{ gap: 6 }}>

        ${row("Daily goal", "Questions answered + flashcards reviewed per day.", html`<${Seg} label="Daily goal" value=${st.dailyGoal} onChange=${v => Actions.setSetting("dailyGoal", v)} options=${[10, 20, 30, 50, 75, 100].map(v => ({ v, l: String(v) }))} />`)}
        ${row("Grade scale", "Minimum percentage for each grade; anything lower is an F.", html`<div className="row" style=${{ gap: 8 }}>${["A", "B", "C", "D"].map(gradeInput)}</div>`)}
      </section>
      <section className="card stack">

      ${confirmReset && html`<${Modal} label="Reset progress" onClose=${() => setConfirmReset(false)}>
        <h2>Reset all progress?</h2>
        <p className="muted">This permanently clears XP, levels, streaks, achievements, flashcard ratings, mastery, question history and test results. Your settings are kept.</p>
        <label htmlFor="reset-confirm" className="faint">Type RESET to confirm</label>
        <input id="reset-confirm" className="input" value=${typed} onInput=${e => setTyped(e.target.value)} autoComplete="off" />
        <div className="row" style=${{ justifyContent: "flex-end" }}><button className="btn" autoFocus onClick=${() => setConfirmReset(false)}>Cancel</button><button className="btn danger" disabled=${typed.trim().toUpperCase() !== "RESET"} onClick=${() => { Store.reset(); setConfirmReset(false); }}>Reset everything</button></div>
      <//>`}
    </div>`;
  }

  // ======================================================================
  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();

</script>

</html>
